name: Balk, prijskleuren en linkveld nakijken

# Kijkt gericht naar de drie laatste wijzigingen: de oranje loopbalk met drie
# boodschappen, de kleur van de actieprijs en het optionele linkveld in de
# winkelwagenlade.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/drieproef.yml', 'preview/drie-trigger.txt']

permissions:
  contents: write

jobs:
  drie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Nakijken
        run: |
          mkdir -p preview
          cat > drie.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          const PV = '?preview_theme_id=196665213305';
          const VARIANT = 64057218662777; // Google Review-standaard wit
          const log = [];
          const b = await chromium.launch();

          const schoon = (p) => p.evaluate(() => {
            document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner, .shopify-pc__banner').forEach((el) => el.remove());
          });

          // ---------- 1. de loopbalk ----------
          {
            const ctx = await b.newContext({ viewport: { width: 1440, height: 900 } });
            const p = await ctx.newPage();
            await p.goto(BASE + '/' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(2500);
            await schoon(p);

            const balk = await p.evaluate(() => {
              const el = document.querySelector('.marquee');
              if (!el) return null;
              const s = getComputedStyle(el);
              const teksten = [...new Set([...el.querySelectorAll('span')].map((x) => x.textContent.trim()))];
              const na = getComputedStyle(el, '::after');
              return {
                achtergrond: s.backgroundImage.slice(0, 160),
                kleurTekst: getComputedStyle(el.querySelector('span')).color,
                animatie: s.animationName,
                glans: na.animationName,
                stippen: el.querySelectorAll('.mq-dot').length,
                teksten,
                hoogte: Math.round(el.getBoundingClientRect().height),
              };
            });
            log.push('== loopbalk');
            if (!balk) log.push('   !! .marquee niet gevonden');
            else {
              log.push(`   teksten: ${balk.teksten.join(' | ')}`);
              log.push(`   achtergrond: ${balk.achtergrond}`);
              log.push(`   tekstkleur: ${balk.kleurTekst}  hoogte: ${balk.hoogte}px  stippen: ${balk.stippen}`);
              log.push(`   animatie: ${balk.animatie}  glans: ${balk.glans}`);
              const verwacht = ['70', 'Zomerkorting tot 20%', 'Verstuurd vanuit Nederland'];
              verwacht.forEach((v) => {
                if (!balk.teksten.some((t) => t.includes(v))) log.push(`   !! mist: ${v}`);
              });
              if (!/rgb\(\s*2[0-9]{2}/.test(balk.achtergrond) && !balk.achtergrond.includes('gradient')) {
                log.push('   !! geen verloop op de balk');
              }
            }
            await p.screenshot({ path: 'preview/balk.png', clip: { x: 0, y: 0, width: 1440, height: 120 } });
            await ctx.close();
          }

          // ---------- 2. prijskleuren ----------
          for (const [naam, pad] of [
            ['productpagina', '/products/tapkaarten-google-review-standaard'],
            ['collectie', '/collections/alle-tapkaarten'],
          ]) {
            const ctx = await b.newContext({ viewport: { width: 1440, height: 1200 } });
            const p = await ctx.newPage();
            await p.goto(BASE + pad + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(3000);
            await schoon(p);

            const prijzen = await p.evaluate(() => {
              const uit = [];
              document.querySelectorAll('*').forEach((el) => {
                if (el.children.length) return;
                const t = (el.textContent || '').trim();
                if (!/^€\s?[\d.]+,\d{2}$/.test(t)) return;
                const s = getComputedStyle(el);
                uit.push({
                  tekst: t,
                  kleur: s.color,
                  door: s.textDecorationLine.includes('line-through') || el.closest('s,del') !== null,
                  klasse: (el.className || '').toString().slice(0, 60),
                });
              });
              return uit;
            });
            log.push(`\n== prijskleuren op de ${naam}`);
            prijzen.slice(0, 14).forEach((x) => {
              log.push(`   ${x.tekst.padEnd(10)} kleur=${x.kleur.padEnd(20)} doorgestreept=${x.door ? 'ja' : 'nee'}  ${x.klasse}`);
            });
            const rood = (k) => /rgb\(\s*2[0-9]{2},\s*[0-9]{1,2},\s*[0-9]{1,2}\)/.test(k);
            const fout = prijzen.filter((x) => x.door && rood(x.kleur));
            if (fout.length) log.push(`   !! doorgestreepte prijs is nog rood: ${fout.map((f) => f.tekst).join(', ')}`);
            const nieuw = prijzen.filter((x) => !x.door);
            if (nieuw.length && !nieuw.some((x) => rood(x.kleur))) log.push('   !! geen enkele actieprijs is rood');
            await p.screenshot({ path: `preview/prijs-${naam}.png`, clip: { x: 0, y: 0, width: 1440, height: 1000 } });
            await ctx.close();
          }

          // ---------- 3. linkveld in de winkelwagenlade ----------
          {
            const ctx = await b.newContext({ viewport: { width: 1440, height: 1000 } });
            const p = await ctx.newPage();
            await p.goto(BASE + '/' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(2000);
            await p.evaluate((id) => fetch('/cart/update.js', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ updates: { [id]: 2 } }),
            }), VARIANT);
            await p.waitForTimeout(1500);
            await p.reload({ waitUntil: 'domcontentloaded' });
            await p.waitForTimeout(2500);
            await schoon(p);

            await p.click('[data-cart-toggle]').catch(() => {});
            await p.waitForTimeout(1500);

            const lade = await p.evaluate(() => {
              const blok = document.querySelector('[data-tk3-cartlink]');
              const veld = document.querySelector('[data-tk3-cartlink-veld]');
              const knop = document.querySelector('.cart-drawer__checkout-button');
              return {
                blok: !!blok,
                open: blok ? blok.querySelector('details')?.open ?? null : null,
                samenvatting: blok ? (blok.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 140) : '',
                veld: !!veld,
                knopZichtbaar: knop ? knop.getBoundingClientRect().height > 0 : false,
              };
            });
            log.push('\n== winkelwagenlade');
            log.push(`   linkblok aanwezig: ${lade.blok}  dichtgeklapt: ${lade.open === false}`);
            log.push(`   tekst: ${lade.samenvatting}`);
            log.push(`   afrekenknop zichtbaar: ${lade.knopZichtbaar}`);
            if (!lade.blok) log.push('   !! linkblok ontbreekt in de lade');

            // uitklappen, invullen en kijken of het als kenmerk wordt opgeslagen
            await p.click('[data-tk3-cartlink] summary').catch(() => {});
            await p.waitForTimeout(400);
            await p.fill('[data-tk3-cartlink-veld]', 'https://g.page/r/proef').catch(() => {});
            await p.click('.cart-drawer__title').catch(() => {});
            await p.waitForTimeout(2500);
            const kenmerk = await p.evaluate(() => fetch('/cart.js').then((r) => r.json()).then((c) => c.attributes));
            log.push(`   kenmerken na invullen: ${JSON.stringify(kenmerk)}`);
            if (!kenmerk || !kenmerk['Link voor de kaart']) log.push('   !! link is niet opgeslagen als kenmerk');
            await p.screenshot({ path: 'preview/lade-link.png' });

            // verzendkosten in de winkelwagen nagaan bij 2 en bij 4 stuks
            for (const n of [2, 4]) {
              await p.evaluate((a) => fetch('/cart/update.js', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ updates: { [a.id]: a.n } }),
              }), { id: VARIANT, n });
              await p.waitForTimeout(1200);
              const c = await p.evaluate(() => fetch('/cart.js').then((r) => r.json()));
              log.push(`   ${n} stuks: totaal ${(c.total_price / 100).toFixed(2)} (gratis verzenden vanaf 70,00)`);
            }

            await p.evaluate((id) => fetch('/cart/update.js', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ updates: { [id]: 0 }, attributes: { 'Link voor de kaart': '' } }),
            }), VARIANT).catch(() => {});
            await ctx.close();
          }

          // ---------- 4. productpagina: linkveld dichtgeklapt ----------
          {
            const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const p = await ctx.newPage();
            await p.goto(BASE + '/products/tapkaarten-google-review-standaard' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(3000);
            await schoon(p);
            const veld = await p.evaluate(() => {
              const d = document.querySelector('details.tk3-linkveld');
              return d ? { open: d.open, tekst: (d.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 120) } : null;
            });
            log.push('\n== productpagina (telefoon)');
            log.push(veld ? `   linkveld dichtgeklapt: ${!veld.open} — ${veld.tekst}` : '   !! linkveld niet gevonden');
            await p.screenshot({ path: 'preview/product-mobiel-link.png', fullPage: true });
            await ctx.close();
          }

          await b.close();
          fs.writeFileSync('preview/drieproef.txt', log.join('\n') + '\n');
          console.log(log.join('\n'));
          JS
          node drie.mjs

      - name: Terugcommitten
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/drieproef.txt preview/balk.png preview/prijs-*.png preview/lade-link.png preview/product-mobiel-link.png || true
          git commit -m "Uitkomst van de drieproef" || echo "niets gewijzigd"
          git push || true
