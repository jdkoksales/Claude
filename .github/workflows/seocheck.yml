name: Google-weergave nakijken

# Leest uit wat Google op de homepage aantreft: titel, omschrijving,
# deelafbeelding, logo en favicon. De bestanden worden daarna echt opgehaald —
# een meta-tag die naar een 404 wijst levert geen plaatje op, en een favicon
# die niet vierkant is wordt door Google genegeerd.
#
# Het gepubliceerde thema en het conceptthema worden allebei bekeken. De
# strenge controles gelden voor het concept: daar staan de correcties in,
# want schrijven naar het gepubliceerde thema mag niet.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/seocheck.yml', 'preview/seo-trigger.txt']

permissions:
  contents: write

jobs:
  kijken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Ophalen en nalezen
        run: |
          mkdir -p preview
          cat > seo.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const CONCEPT = '196964024697';
          const log = [];
          const fouten = [];

          const haal = async (url, opties = {}) => {
            try {
              const r = await fetch(url, { redirect: 'follow', ...opties });
              return { ok: true, status: r.status, url: r.url, r };
            } catch (e) {
              return { ok: false, fout: String(e) };
            }
          };
          const pak = (html, re) => {
            const m = html.match(re);
            return m ? m[1].trim() : null;
          };

          // Leest de tags uit een stuk HTML. Zelfde functie voor de live pagina
          // en voor het concept, zodat een verschil echt een verschil is.
          const lees = (html) => ({
            titel: pak(html, /<title[^>]*>([\s\S]*?)<\/title>/i),
            omschrijving: pak(html, /<meta\s+name=["']description["']\s+content=["']([\s\S]*?)["']/i),
            ogTitel: pak(html, /<meta\s+property=["']og:title["']\s+content=["']([^"']*)["']/i),
            ogImage: pak(html, /<meta\s+property=["']og:image["']\s+content=["']([^"']*)["']/i),
            robots: pak(html, /<meta\s+name=["']robots["']\s+content=["']([^"']*)["']/i),
            logo: pak(html, /"logo":\s*"([^"]+)"/),
            iconen: [...html.matchAll(/<link\s+rel=["'](?:icon|apple-touch-icon)["'][^>]*href=["']([^"']*)["']/gi)]
              .map((m) => m[1]),
          });

          const noem = (naam, t) => {
            log.push(`   titel:        ${t.titel ? t.titel.replace(/\s+/g, ' ') : 'ONTBREEKT'}`);
            log.push(`   omschrijving: ${t.omschrijving || 'ONTBREEKT'}`);
            log.push(`   og:title:     ${t.ogTitel || 'ONTBREEKT'}`);
            log.push(`   og:image:     ${t.ogImage || 'ONTBREEKT'}`);
            log.push(`   logo:         ${t.logo || 'ONTBREEKT'}`);
            log.push(`   iconen:       ${t.iconen.length ? t.iconen.join(' | ') : 'ONTBREEKT'}`);
            log.push(`   robots-meta:  ${t.robots || 'geen (dus indexeerbaar)'}`);
          };

          // Haalt elk plaatje echt op en meet het na.
          const keurBestanden = async (t, basis, waar) => {
            const lijst = [['og:image', t.ogImage], ['logo uit bedrijfsgegevens', t.logo]]
              .concat(t.iconen.map((h, i) => [`favicon ${i + 1}`, h]));
            for (const [wat, adres] of lijst) {
              if (!adres) { fouten.push(`${waar}: ${wat} ontbreekt in de HTML`); continue; }
              const vol = adres.startsWith('http') ? adres : new URL(adres, basis).href;
              const c = await haal(vol);
              const type = c.ok ? c.r.headers.get('content-type') : null;
              const bytes = c.ok ? Buffer.from(await c.r.arrayBuffer()) : Buffer.alloc(0);

              // Breedte en hoogte staan bij een PNG op vaste plekken in de kop.
              let maat = null;
              if (bytes.length > 24 && bytes.slice(1, 4).toString() === 'PNG') {
                maat = { b: bytes.readUInt32BE(16), h: bytes.readUInt32BE(20) };
              }
              log.push(`   ${wat}: ${c.ok ? c.status : c.fout} ${type || ''} ${bytes.length} bytes` +
                (maat ? ` ${maat.b}x${maat.h}` : ''));

              if (!c.ok || c.status !== 200) { fouten.push(`${waar}: ${wat} geeft geen 200 (${vol})`); continue; }
              if (!/^image\//.test(type || '')) fouten.push(`${waar}: ${wat} is geen afbeelding maar ${type}`);
              if (bytes.length < 200) fouten.push(`${waar}: ${wat} is verdacht klein (${bytes.length} bytes)`);
              if (wat.startsWith('favicon')) {
                if (!maat) fouten.push(`${waar}: ${wat} is geen PNG, maat niet te meten`);
                else {
                  if (maat.b !== maat.h) fouten.push(`${waar}: ${wat} is niet vierkant (${maat.b}x${maat.h})`);
                  if (maat.b < 48) fouten.push(`${waar}: ${wat} is ${maat.b}px, Google wil minstens 48px`);
                }
              }
            }
          };

          // ---- 1. Het gepubliceerde thema, zoals een crawler het ziet ----
          for (const start of ['http://tapkaarten.nl/', 'https://www.tapkaarten.nl/']) {
            const res = await haal(start, {
              headers: { 'user-agent': 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' },
            });
            if (!res.ok) { log.push(`\nLIVE ${start} → onbereikbaar: ${res.fout}`); fouten.push(`${start} onbereikbaar`); continue; }
            const html = await res.r.text();
            const t = lees(html);
            log.push(`\nLIVE ${start} → ${res.status} ${res.url}, ${html.length} tekens`);
            noem(start, t);
            if (!t.titel) fouten.push(`live: geen titel`);
            if (!t.omschrijving) fouten.push(`live: geen metabeschrijving`);
            if (t.robots && /noindex/i.test(t.robots)) fouten.push(`live: robots-meta staat op ${t.robots}`);
          }

          // ---- 2. Het conceptthema: hier horen de correcties te staan ----
          const b = await chromium.launch();
          const ctx = await b.newContext({ locale: 'nl-NL' });
          const p = await ctx.newPage();
          await p.goto(`https://tapkaarten.nl/?preview_theme_id=${CONCEPT}`, { waitUntil: 'domcontentloaded', timeout: 60000 });
          await p.waitForTimeout(2500);
          const themaId = await p.evaluate(() => (window.Shopify && Shopify.theme && Shopify.theme.id) || 'onbekend');
          const conceptHtml = await p.content();
          await b.close();

          log.push(`\nCONCEPT (thema ${themaId})`);
          if (String(themaId) !== CONCEPT) {
            fouten.push(`het concept werd niet geladen, er is thema ${themaId} gemeten`);
          } else {
            const t = lees(conceptHtml);
            noem('concept', t);
            if (!t.titel) fouten.push('concept: geen titel');
            if (!t.omschrijving) fouten.push('concept: geen metabeschrijving');
            await keurBestanden(t, 'https://tapkaarten.nl/', 'concept');
          }

          // ---- 3. Randvoorwaarden ----
          const rt = await haal('https://tapkaarten.nl/robots.txt');
          if (rt.ok) {
            const tekst = await rt.r.text();
            if (/^Disallow: \/$/m.test(tekst)) fouten.push('robots.txt sluit de hele site uit');
            log.push(`\nrobots.txt: ${rt.status}, sluit de site niet uit`);
          } else fouten.push('robots.txt onbereikbaar');

          const sm = await haal('https://tapkaarten.nl/sitemap.xml');
          log.push(`sitemap.xml: ${sm.ok ? sm.status : sm.fout}`);
          if (!sm.ok || sm.status !== 200) fouten.push('sitemap.xml is niet bereikbaar');

          const kop = fouten.length
            ? `GEVONDEN: ${fouten.length} punten\n` + fouten.map((f) => ' - ' + f).join('\n')
            : 'GEEN AFWIJKINGEN GEVONDEN';
          fs.writeFileSync('preview/seo.txt', kop + '\n' + log.join('\n') + '\n');
          console.log(kop);
          JS
          node seo.mjs

      - name: Vastleggen
        if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add preview/seo.txt || true
          git commit -m "Uitkomst van de Google-weergave" || exit 0
          for poging in 1 2 3 4; do
            git pull --rebase origin claude/3d-product-animations-btyc7y && \
              git push origin HEAD:claude/3d-product-animations-btyc7y && break
            sleep $((poging * 4))
          done
