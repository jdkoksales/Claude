name: Winkelwagenlade doormeten

# Alleen de lade, en met rust aan de winkelwagen-API: die knijpt af zodra er
# in korte tijd veel verzoeken komen en geeft dan een HTML-foutpagina terug.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['preview/lade-trigger.txt']

permissions:
  contents: write

concurrency:
  group: ladeproef
  cancel-in-progress: false

jobs:
  proef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Doormeten
        run: |
          mkdir -p preview
          cat > lade.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          // Het concept-thema staat sinds vandaag live, dus daar mag ik niet meer
          // in schrijven. Deze proef kijkt naar de kopie waar de wijzigingen in
          // staan; die publiceert de eigenaar zelf.
          const PV = '?preview_theme_id=196964024697';
          const KAART = 64057218662777;
          const log = [];
          const fouten = [];

          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 1440, height: 1000 }, locale: 'nl-NL' });
          const p = await ctx.newPage();
          p.on('pageerror', (e) => fouten.push('JS: ' + e.message.slice(0, 110)));

          // Rustig aan: tussen elke winkelwagen-actie vier seconden.
          const rust = () => p.waitForTimeout(4000);

          const kar = async (url, opties) => {
            for (let poging = 0; poging < 4; poging++) {
              const uit = await p.evaluate(async (a) => {
                const r = await fetch(a.url, a.opties || undefined);
                const t = await r.text();
                try { return { ok: r.ok, data: JSON.parse(t) }; }
                catch { return { ok: false, status: r.status }; }
              }, { url, opties }).catch(() => null);
              if (uit && uit.ok) return uit.data;
              log.push(`   (opnieuw: ${url} gaf ${uit ? uit.status : 'niets'})`);
              await p.waitForTimeout(6000 * (poging + 1));
            }
            return null;
          };

          const lees = () => p.evaluate(() => {
            const balk = document.querySelector('[data-tk3-verzendbalk]');
            const vak = document.querySelector('[data-tk3-bijverkoop]');
            const knop = document.querySelector('.cart-drawer__checkout-button');
            const duw = document.querySelector('[data-tk3-staffelduw]');
            return {
              duwZichtbaar: duw ? !duw.hidden : null,
              duwKop: duw?.querySelector('[data-tk3-staffelduw-kop]')?.textContent.trim() || null,
              duwSub: duw?.querySelector('[data-tk3-staffelduw-sub]')?.textContent.trim() || null,
              duwKnop: duw ? !duw.querySelector('[data-tk3-staffelduw-knop]').hidden : null,
              duwMax: duw ? duw.classList.contains('is-max') : null,
              balk: balk ? !balk.hidden : null,
              tekst: balk ? balk.innerText.replace(/\s+/g, ' ').trim() : null,
              vulling: balk?.querySelector('[data-tk3-verzendvulling]')?.style.width || null,
              gehaald: balk ? balk.classList.contains('is-gehaald') : null,
              bij: vak ? !vak.hidden : null,
              bijtekst: vak ? vak.innerText.replace(/\s+/g, ' ').trim().slice(0, 70) : null,
              knopOnder: knop ? Math.round(knop.getBoundingClientRect().bottom) : null,
            };
          });

          try {
            await p.goto(BASE + '/products/tapkaarten-google-review-standaard' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(3000);

            // Eerst kijken wat de winkelwagen-API überhaupt teruggeeft. Twee
            // proeven op rij kregen HTML in plaats van JSON; zonder te weten
            // wát voor pagina dat is, is repareren gokken.
            const diagnose = await p.evaluate(async () => {
              const uit = [];
              for (const url of ['/cart.js', '/cart/update.js']) {
                try {
                  const r = await fetch(url, url === '/cart.js' ? undefined : {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates: {} }),
                  });
                  const t = await r.text();
                  uit.push({
                    url,
                    status: r.status,
                    type: r.headers.get('content-type'),
                    begin: t.slice(0, 220).replace(/\s+/g, ' '),
                  });
                } catch (e) { uit.push({ url, fout: String(e).slice(0, 120) }); }
              }
              return uit;
            });
            log.push('== wat geeft de winkelwagen-API terug?');
            diagnose.forEach((d) => {
              log.push(`   ${d.url}: status=${d.status} type=${d.type}`);
              log.push(`      ${d.begin || d.fout}`);
            });
            log.push('');
            await p.evaluate(() => {
              document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
            });

            await kar('/cart/clear.js', { method: 'POST' });
            await rust();

            for (const n of [1, 2, 3, 4]) {
              const c = await kar('/cart/update.js', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ updates: { [KAART]: n } }),
              });
              if (!c) { log.push(`${n} kaart(en): winkelwagen niet uit te lezen`); fouten.push('winkelwagen niet uit te lezen'); continue; }
              await p.click('[data-cart-toggle]').catch(() => {});
              await p.waitForTimeout(4000);
              const m = await lees();
              log.push(`${n} kaart(en) — totaal ${(c.total_price / 100).toFixed(2)}`);
              log.push(`   balk zichtbaar: ${m.balk}   "${m.tekst}"`);
              log.push(`   vulling ${m.vulling}   gehaald: ${m.gehaald}`);
              log.push(`   bijverkoop: ${m.bij} — ${m.bijtekst}`);
              log.push(`   staffelduw: ${m.duwZichtbaar} | ${m.duwKop}`);
              log.push(`               ${m.duwSub} | knop: ${m.duwKnop} | max: ${m.duwMax}`);
              log.push(`   afrekenknop eindigt op ${m.knopOnder}px van 1000`);
              if (!m.duwZichtbaar) fouten.push(`staffelduw niet zichtbaar bij ${n}`);
              if (n < 4 && !m.duwKnop) fouten.push(`geen knop "kaart erbij" bij ${n}`);
              if (n < 4 && m.duwSub && !/€/.test(m.duwSub)) fouten.push(`geen bedrag in de staffelduw bij ${n}`);
              if (n === 4 && !m.duwMax) fouten.push('bij 4 stuks geen melding dat de korting maximaal is');
              if (n === 4 && m.duwKnop) fouten.push('bij 4 stuks staat er nog een knop "kaart erbij"');
              const pct = { 1: 0, 2: 10, 3: 15, 4: 20 }[n];
              const verwacht = 3495 * n - Math.floor(3495 * (pct / 100)) * n;
              if (c.total_price !== verwacht) fouten.push(`staffelprijs bij ${n} stuks: ${(c.total_price / 100).toFixed(2)} in plaats van ${(verwacht / 100).toFixed(2)}`);
              if (!m.balk) fouten.push(`verzendbalk niet zichtbaar bij ${n}`);
              if (n === 2 && m.gehaald) fouten.push('balk zegt gehaald bij 62,92');
              if (n === 2 && m.tekst && m.tekst.indexOf('7,08') === -1) fouten.push('balk noemt niet het juiste tekort van 7,08');
              if (!m.bij) fouten.push(`bijverkoop niet zichtbaar bij ${n}`);
              await p.screenshot({ path: `preview/lade-${n}.png` });
              await p.click('[data-cart-drawer-close]').catch(() => {});
              await rust();
            }

            // sticker erbij via de knop
            await p.click('[data-cart-toggle]').catch(() => {});
            await p.waitForTimeout(3000);
            const voor = await kar('/cart.js');
            await p.click('[data-tk3-bijverkoop-knop]').catch(() => {});
            await p.waitForTimeout(7000);
            const na = await kar('/cart.js');
            if (voor && na) {
              log.push(`\nsticker toevoegen: ${voor.item_count} → ${na.item_count} stuks, ` +
                `${(voor.total_price / 100).toFixed(2)} → ${(na.total_price / 100).toFixed(2)}`);
              if (na.item_count <= voor.item_count) fouten.push('sticker toevoegen werkt niet');
              const m2 = await lees();
              log.push(`   balk nu: "${m2.tekst}" gehaald=${m2.gehaald}`);
              log.push(`   bijverkoop nu verborgen: ${m2.bij === false}`);
              if (na.total_price >= 7000 && !m2.gehaald) fouten.push('balk springt niet naar gehaald boven de 70');
              await p.screenshot({ path: 'preview/lade-sticker.png' });
            } else { fouten.push('winkelwagen niet uit te lezen rond de bijverkoop'); }

            // Knop "kaart erbij" indrukken vanaf precies twee kaarten. De lade
            // sluiten en de pagina herladen is nodig: met een open lade vangt de
            // overlay de klik op de winkelwagenknop op, en dan verversen de
            // regels niet. Dat sloopte de vorige meting.
            await p.click('.cart-drawer__close').catch(() => {});
            await rust();
            await kar('/cart/clear.js', { method: 'POST' });
            await rust();
            await kar('/cart/update.js', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ updates: { [KAART]: 2 } }),
            });
            await rust();
            await p.reload({ waitUntil: 'domcontentloaded' });
            await p.waitForTimeout(3500);
            await p.evaluate(() => {
              document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
            });
            await p.click('[data-cart-toggle]').catch(() => {});
            await p.waitForTimeout(3500);
            const vooraf = await lees();
            log.push(`\nvoor de klik: ${vooraf.duwKop} | knop: ${vooraf.duwKnop}`);
            if (!vooraf.duwKnop) fouten.push('knop "kaart erbij" staat er niet bij twee kaarten');
            // De knop voegt sinds vandaag niet meer blind dezelfde kaart toe
            // maar opent een keuze. Hier dus alleen nog: gaat die open, en zit
            // de kaart die al in de wagen ligt er ook in?
            const v2 = await kar('/cart.js');
            await p.click('[data-tk3-staffelduw-knop]').catch(() => {});
            await p.waitForTimeout(2000);
            const kd = await p.evaluate(() => {
              const kies = document.querySelector('[data-tk3-kies]');
              if (!kies) return { bestaat: false };
              const r = kies.getBoundingClientRect();
              return {
                bestaat: true, hoog: Math.round(r.height),
                aantal: kies.querySelectorAll('[data-tk3-kies-item]').length,
              };
            });
            const n2 = await kar('/cart.js');
            log.push(`\nknop "kaart erbij" opent de keuze: ${kd.bestaat ? kd.hoog + 'px met ' + kd.aantal + ' kaarten' : 'staat er niet'}`);
            if (!kd.bestaat || kd.hoog < 100) fouten.push('keuzelaag opent niet vanaf de knop');
            if (kd.aantal < 2) fouten.push('keuzelaag toont minder dan twee kaarten');
            if (v2 && n2 && n2.item_count !== v2.item_count) {
              fouten.push('de knop voegt nog steeds rechtstreeks toe in plaats van te laten kiezen');
            }
            await p.evaluate(() => document.querySelector('[data-tk3-kies-sluit]')?.click());
            await p.waitForTimeout(800);
            await p.screenshot({ path: 'preview/lade-erbij.png' });

            // welke link op de productpagina heeft geen doel?
            const leeg = await p.evaluate(() =>
              [...document.querySelectorAll('a')]
                .filter((a) => { const h = a.getAttribute('href'); return h === '' || h === '#' || h === null; })
                .map((a) => ({
                  klasse: (a.className || '').toString().slice(0, 60),
                  tekst: (a.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 40),
                  ouder: (a.parentElement?.className || '').toString().slice(0, 50),
                }))
            );
            log.push('\nlinks zonder doel op de productpagina:');
            leeg.forEach((l) => log.push(`   klasse "${l.klasse}" tekst "${l.tekst}" in "${l.ouder}"`));

            await rust();
            await kar('/cart/clear.js', { method: 'POST' });

            // ---- de lade op een telefoon ----
            // Bewust hetzelfde tabblad: een verse browsercontext kreeg een
            // ander, leeg winkelwagentje dan waarmee de pagina was opgebouwd,
            // en dan verbergt de lade terecht alles. Door alleen het venster
            // te verkleinen blijft de sessie die hierboven aantoonbaar werkt
            // gewoon intact.
            log.push('\n== de lade op een telefoon (411x750)');
            await p.evaluate(() => document.querySelector('.cart-drawer__close')?.click());
            await rust();
            await p.setViewportSize({ width: 411, height: 750 });

            for (const aantal of [2, 4]) {
              await kar('/cart/update.js', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ updates: { [KAART]: aantal } }),
              });
              await rust();
              const nu = await kar('/cart.js');
              if (!nu || nu.item_count !== aantal) {
                fouten.push(`${aantal} kaarten: winkelwagen bleef op ${nu ? nu.item_count : '?'} staan, meting overgeslagen`);
                continue;
              }

              await p.reload({ waitUntil: 'domcontentloaded' });
              await p.waitForTimeout(3500);
              await p.evaluate(() => {
                document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
              });

              // Staat het paneel echt binnen het scherm? De lade sluit met een
              // transform en niet met display:none, dus hoogte meten zegt niets
              // over open of dicht: die is ook buiten beeld gewoon berekend.
              // Daardoor was mijn vorige test meteen waar en werd er nooit
              // geklikt — de metingen klopten, maar van een lade die dichtzat.
              const isOpen = () => p.evaluate(() => {
                const paneel = document.querySelector('.cart-drawer__panel');
                if (!paneel) return false;
                const r = paneel.getBoundingClientRect();
                return r.width > 0 && r.left < window.innerWidth - 20 && r.right > 20;
              });
              for (let poging = 0; poging < 4; poging++) {
                if (await isOpen()) break;
                await p.click('[data-cart-toggle]').catch(() => {});
                await p.waitForTimeout(3000);
              }
              // De blokken worden pas gevuld nadat de wagen is uitgelezen.
              for (let poging = 0; poging < 8; poging++) {
                const klaar = await p.evaluate(() => {
                  const b = document.querySelector('[data-tk3-verzendbalk]');
                  return !!(b && b.getBoundingClientRect().height > 0);
                });
                if (klaar) break;
                await p.waitForTimeout(1200);
              }

              const m = await p.evaluate(() => {
                // De werkelijk gerenderde hoogte, niet het hidden-attribuut:
                // die twee liepen uiteen omdat display:flex de [hidden]-regel
                // van de browser versloeg.
                const h = (el) => (el ? Math.round(el.getBoundingClientRect().height) : 0);
                const zichtbaar = (el) => !!(el && el.getBoundingClientRect().height > 0);
                const body = document.querySelector('[data-cart-drawer-body]');
                const duw = document.querySelector('[data-tk3-staffelduw]');
                const vak = document.querySelector('[data-tk3-bijverkoop]');
                const balk = document.querySelector('[data-tk3-verzendbalk]');
                const voet = document.querySelector('[data-cart-drawer-footer]');
                const knop = document.querySelector('.cart-drawer__checkout-button');
                return {
                  lijst: h(body), voet: h(voet), duw: h(duw), vak: h(vak), balk: h(balk),
                  duwZichtbaar: zichtbaar(duw), vakZichtbaar: zichtbaar(vak),
                  duwKop: duw?.querySelector('[data-tk3-staffelduw-kop]')?.textContent.trim() || null,
                  duwLiegt: !!(duw && duw.hidden && zichtbaar(duw)),
                  vakLiegt: !!(vak && vak.hidden && zichtbaar(vak)),
                  knopOnder: knop ? Math.round(knop.getBoundingClientRect().bottom) : null,
                  venster: innerHeight,
                };
              });

              log.push(`   ${aantal} kaart(en): artikelenlijst ${m.lijst}px, voettekst ${m.voet}px van ${m.venster}px venster`);
              log.push(`      staffelduw ${m.duw}px (${m.duwZichtbaar ? 'zichtbaar' : 'verborgen'}), ` +
                `bijverkoop ${m.vak}px (${m.vakZichtbaar ? 'zichtbaar' : 'verborgen'}), verzendbalk ${m.balk}px`);
              if (m.duwKop) log.push(`      duw: ${m.duwKop}`);

              if (!(await isOpen())) fouten.push(`${aantal} kaarten: lade ging niet open, meting zegt niets`);
              if (m.voet === 0) fouten.push(`${aantal} kaarten: voettekst niet zichtbaar, meting zegt niets`);
              if (m.balk === 0) fouten.push(`${aantal} kaarten: verzendbalk ontbreekt, de lade is niet uitgelezen`);
              if (!m.duwZichtbaar && !m.vakZichtbaar) fouten.push(`${aantal} kaarten: geen enkele aanbieding zichtbaar`);
              if (m.duwZichtbaar && m.vakZichtbaar) fouten.push(`${aantal} kaarten: beide aanbiedingen staan tegelijk op een telefoon`);
              if (m.duwLiegt) fouten.push(`${aantal} kaarten: staffelduw staat op hidden maar is toch zichtbaar`);
              if (m.vakLiegt) fouten.push(`${aantal} kaarten: bijverkoop staat op hidden maar is toch zichtbaar`);
              if (m.lijst < 200) fouten.push(`${aantal} kaarten: artikelenlijst maar ${m.lijst}px hoog op een telefoon`);
              if (m.knopOnder && m.knopOnder > m.venster) fouten.push(`${aantal} kaarten: afrekenknop valt onder het scherm`);

              await p.screenshot({ path: `preview/lade-mobiel-${aantal}.png` });

              // De keuzelaag: opent hij, staan er meerdere soorten in, en voegt
              // hij toe wat je aanwijst in plaats van nog eens dezelfde kaart?
              if (aantal === 2 && m.duwZichtbaar) {
                await p.click('[data-tk3-staffelduw-knop]').catch(() => {});
                await p.waitForTimeout(1200);
                const k = await p.evaluate(() => {
                  const kies = document.querySelector('[data-tk3-kies]');
                  // Onderscheid maken tussen "staat er niet", "staat er maar is
                  // verborgen" en "staat er met nul hoogte" — anders weet ik bij
                  // een mislukking nog steeds niet waar ik moet kijken.
                  if (!kies) return { bestaat: false };
                  const r = kies.getBoundingClientRect();
                  const s = getComputedStyle(kies);
                  const items = [...kies.querySelectorAll('[data-tk3-kies-item]')].map((el) => ({
                    naam: el.querySelector('.tk3-kies-naam')?.textContent.trim(),
                    variant: el.getAttribute('data-variant'),
                  }));
                  return {
                    bestaat: true, verborgen: kies.hidden, display: s.display,
                    positie: s.position, zIndex: s.zIndex,
                    hoog: Math.round(r.height), breed: Math.round(r.width), items,
                  };
                });
                if (!k.bestaat) {
                  fouten.push('keuzelaag staat niet in de pagina');
                } else if (k.hoog < 100) {
                  fouten.push(`keuzelaag gaat niet open (hidden=${k.verborgen}, display=${k.display}, hoogte=${k.hoog})`);
                } else {
                  log.push(`      keuzelaag ${k.breed}x${k.hoog} met ${k.items.length} kaarten:`);
                  k.items.forEach((i) => log.push(`         ${i.naam}`));
                  if (k.items.length < 2) fouten.push('keuzelaag toont minder dan twee kaarten');
                  await p.screenshot({ path: 'preview/lade-keuze.png' });

                  // Een ándere kaart aanwijzen dan die al in de wagen ligt.
                  const anders = k.items.find((i) => String(i.variant) !== String(KAART));
                  if (!anders) {
                    fouten.push('keuzelaag biedt geen andere kaart dan die al in de wagen ligt');
                  } else {
                    // De fout niet wegslikken: een klik die niet aankomt en een
                    // winkelwagen die de variant weigert zien er anders identiek uit.
                    let klikfout = null;
                    await p.click(`[data-tk3-kies-item][data-variant="${anders.variant}"]`, { timeout: 8000 })
                      .catch((err) => { klikfout = String(err.message).split('\n')[0].slice(0, 120); });
                    if (klikfout) log.push(`      klik kwam niet aan: ${klikfout}`);
                    await p.waitForTimeout(5000);
                    const na = await kar('/cart.js');
                    const soorten = na ? na.items.length : 0;
                    log.push(`      "${anders.naam}" aangewezen — wagen heeft nu ${na ? na.item_count : '?'} stuks in ${soorten} soorten`);

                    if (soorten < 2) {
                      // Accepteert de winkelwagen die variant überhaupt? Dat
                      // scheidt een probleem in de afhandeling van een probleem
                      // met het product zelf.
                      const proef = await p.evaluate(async (id) => {
                        try {
                          const r = await fetch('/cart/add.js', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                            body: JSON.stringify({ items: [{ id: Number(id), quantity: 1 }] }),
                          });
                          const tekst = await r.text();
                          return { status: r.status, begin: tekst.slice(0, 140).replace(/\s+/g, ' ') };
                        } catch (e) { return { fout: String(e.message).slice(0, 120) }; }
                      }, anders.variant);
                      log.push(`      rechtstreeks toevoegen gaf: ${JSON.stringify(proef)}`);
                    }

                    if (!na || na.item_count !== 3) fouten.push(`na kiezen ${na ? na.item_count : '?'} stuks in plaats van 3`);
                    if (soorten < 2) fouten.push('de gekozen kaart is niet toegevoegd, het bleef bij één soort');
                  }
                }
              }

              await p.evaluate(() => document.querySelector('.cart-drawer__close')?.click());
              await p.waitForTimeout(800);
            }
          } catch (e) {
            log.push('AFGEBROKEN: ' + String(e.message).split('\n')[0].slice(0, 140));
            fouten.push('proef afgebroken');
          }

          await b.close();
          const kop = fouten.length
            ? `GEVONDEN: ${[...new Set(fouten)].length} punten\n` + [...new Set(fouten)].map((f) => ' - ' + f).join('\n')
            : 'GEEN AFWIJKINGEN GEVONDEN';
          fs.writeFileSync('preview/ladeproef.txt', kop + '\n\n' + log.join('\n') + '\n');
          console.log(kop);
          JS
          node lade.mjs

      - name: Terugcommitten
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/ladeproef.txt preview/lade-*.png || true
          git commit -m "Uitkomst van de ladeproef" || echo "niets gewijzigd"
          for poging in 1 2 3 4; do
            git pull --rebase origin claude/3d-product-animations-btyc7y && git push && break
            sleep $((poging * 5))
          done
