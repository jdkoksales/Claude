name: Winkelwagenlade doormeten

# Alleen de lade, en met rust aan de winkelwagen-API: die knijpt af zodra er
# in korte tijd veel verzoeken komen en geeft dan een HTML-foutpagina terug.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['preview/lade-trigger.txt']

permissions:
  contents: write

concurrency:
  group: ladeproef
  cancel-in-progress: false

jobs:
  proef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Doormeten
        run: |
          mkdir -p preview
          cat > lade.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          const PV = '?preview_theme_id=196665213305';
          const KAART = 64057218662777;
          const log = [];
          const fouten = [];

          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 1440, height: 1000 }, locale: 'nl-NL' });
          const p = await ctx.newPage();
          p.on('pageerror', (e) => fouten.push('JS: ' + e.message.slice(0, 110)));

          // Rustig aan: tussen elke winkelwagen-actie vier seconden.
          const rust = () => p.waitForTimeout(4000);

          const kar = async (url, opties) => {
            for (let poging = 0; poging < 4; poging++) {
              const uit = await p.evaluate(async (a) => {
                const r = await fetch(a.url, a.opties || undefined);
                const t = await r.text();
                try { return { ok: r.ok, data: JSON.parse(t) }; }
                catch { return { ok: false, status: r.status }; }
              }, { url, opties }).catch(() => null);
              if (uit && uit.ok) return uit.data;
              log.push(`   (opnieuw: ${url} gaf ${uit ? uit.status : 'niets'})`);
              await p.waitForTimeout(6000 * (poging + 1));
            }
            return null;
          };

          const lees = () => p.evaluate(() => {
            const balk = document.querySelector('[data-tk3-verzendbalk]');
            const vak = document.querySelector('[data-tk3-bijverkoop]');
            const knop = document.querySelector('.cart-drawer__checkout-button');
            const duw = document.querySelector('[data-tk3-staffelduw]');
            return {
              duwZichtbaar: duw ? !duw.hidden : null,
              duwKop: duw?.querySelector('[data-tk3-staffelduw-kop]')?.textContent.trim() || null,
              duwSub: duw?.querySelector('[data-tk3-staffelduw-sub]')?.textContent.trim() || null,
              duwKnop: duw ? !duw.querySelector('[data-tk3-staffelduw-knop]').hidden : null,
              duwMax: duw ? duw.classList.contains('is-max') : null,
              balk: balk ? !balk.hidden : null,
              tekst: balk ? balk.innerText.replace(/\s+/g, ' ').trim() : null,
              vulling: balk?.querySelector('[data-tk3-verzendvulling]')?.style.width || null,
              gehaald: balk ? balk.classList.contains('is-gehaald') : null,
              bij: vak ? !vak.hidden : null,
              bijtekst: vak ? vak.innerText.replace(/\s+/g, ' ').trim().slice(0, 70) : null,
              knopOnder: knop ? Math.round(knop.getBoundingClientRect().bottom) : null,
            };
          });

          try {
            await p.goto(BASE + '/products/tapkaarten-google-review-standaard' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(3000);

            // Eerst kijken wat de winkelwagen-API überhaupt teruggeeft. Twee
            // proeven op rij kregen HTML in plaats van JSON; zonder te weten
            // wát voor pagina dat is, is repareren gokken.
            const diagnose = await p.evaluate(async () => {
              const uit = [];
              for (const url of ['/cart.js', '/cart/update.js']) {
                try {
                  const r = await fetch(url, url === '/cart.js' ? undefined : {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ updates: {} }),
                  });
                  const t = await r.text();
                  uit.push({
                    url,
                    status: r.status,
                    type: r.headers.get('content-type'),
                    begin: t.slice(0, 220).replace(/\s+/g, ' '),
                  });
                } catch (e) { uit.push({ url, fout: String(e).slice(0, 120) }); }
              }
              return uit;
            });
            log.push('== wat geeft de winkelwagen-API terug?');
            diagnose.forEach((d) => {
              log.push(`   ${d.url}: status=${d.status} type=${d.type}`);
              log.push(`      ${d.begin || d.fout}`);
            });
            log.push('');
            await p.evaluate(() => {
              document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
            });

            await kar('/cart/clear.js', { method: 'POST' });
            await rust();

            for (const n of [1, 2, 3, 4]) {
              const c = await kar('/cart/update.js', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ updates: { [KAART]: n } }),
              });
              if (!c) { log.push(`${n} kaart(en): winkelwagen niet uit te lezen`); fouten.push('winkelwagen niet uit te lezen'); continue; }
              await p.click('[data-cart-toggle]').catch(() => {});
              await p.waitForTimeout(4000);
              const m = await lees();
              log.push(`${n} kaart(en) — totaal ${(c.total_price / 100).toFixed(2)}`);
              log.push(`   balk zichtbaar: ${m.balk}   "${m.tekst}"`);
              log.push(`   vulling ${m.vulling}   gehaald: ${m.gehaald}`);
              log.push(`   bijverkoop: ${m.bij} — ${m.bijtekst}`);
              log.push(`   staffelduw: ${m.duwZichtbaar} | ${m.duwKop}`);
              log.push(`               ${m.duwSub} | knop: ${m.duwKnop} | max: ${m.duwMax}`);
              log.push(`   afrekenknop eindigt op ${m.knopOnder}px van 1000`);
              if (!m.duwZichtbaar) fouten.push(`staffelduw niet zichtbaar bij ${n}`);
              if (n < 4 && !m.duwKnop) fouten.push(`geen knop "kaart erbij" bij ${n}`);
              if (n < 4 && m.duwSub && !/€/.test(m.duwSub)) fouten.push(`geen bedrag in de staffelduw bij ${n}`);
              if (n === 4 && !m.duwMax) fouten.push('bij 4 stuks geen melding dat de korting maximaal is');
              if (n === 4 && m.duwKnop) fouten.push('bij 4 stuks staat er nog een knop "kaart erbij"');
              const pct = { 1: 0, 2: 10, 3: 15, 4: 20 }[n];
              const verwacht = 3495 * n - Math.floor(3495 * (pct / 100)) * n;
              if (c.total_price !== verwacht) fouten.push(`staffelprijs bij ${n} stuks: ${(c.total_price / 100).toFixed(2)} in plaats van ${(verwacht / 100).toFixed(2)}`);
              if (!m.balk) fouten.push(`verzendbalk niet zichtbaar bij ${n}`);
              if (n === 2 && m.gehaald) fouten.push('balk zegt gehaald bij 62,92');
              if (n === 2 && m.tekst && m.tekst.indexOf('7,08') === -1) fouten.push('balk noemt niet het juiste tekort van 7,08');
              if (!m.bij) fouten.push(`bijverkoop niet zichtbaar bij ${n}`);
              await p.screenshot({ path: `preview/lade-${n}.png` });
              await p.click('[data-cart-drawer-close]').catch(() => {});
              await rust();
            }

            // sticker erbij via de knop
            await p.click('[data-cart-toggle]').catch(() => {});
            await p.waitForTimeout(3000);
            const voor = await kar('/cart.js');
            await p.click('[data-tk3-bijverkoop-knop]').catch(() => {});
            await p.waitForTimeout(7000);
            const na = await kar('/cart.js');
            if (voor && na) {
              log.push(`\nsticker toevoegen: ${voor.item_count} → ${na.item_count} stuks, ` +
                `${(voor.total_price / 100).toFixed(2)} → ${(na.total_price / 100).toFixed(2)}`);
              if (na.item_count <= voor.item_count) fouten.push('sticker toevoegen werkt niet');
              const m2 = await lees();
              log.push(`   balk nu: "${m2.tekst}" gehaald=${m2.gehaald}`);
              log.push(`   bijverkoop nu verborgen: ${m2.bij === false}`);
              if (na.total_price >= 7000 && !m2.gehaald) fouten.push('balk springt niet naar gehaald boven de 70');
              await p.screenshot({ path: 'preview/lade-sticker.png' });
            } else { fouten.push('winkelwagen niet uit te lezen rond de bijverkoop'); }

            // Knop "kaart erbij" indrukken vanaf precies twee kaarten. De lade
            // sluiten en de pagina herladen is nodig: met een open lade vangt de
            // overlay de klik op de winkelwagenknop op, en dan verversen de
            // regels niet. Dat sloopte de vorige meting.
            await p.click('.cart-drawer__close').catch(() => {});
            await rust();
            await kar('/cart/clear.js', { method: 'POST' });
            await rust();
            await kar('/cart/update.js', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ updates: { [KAART]: 2 } }),
            });
            await rust();
            await p.reload({ waitUntil: 'domcontentloaded' });
            await p.waitForTimeout(3500);
            await p.evaluate(() => {
              document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
            });
            await p.click('[data-cart-toggle]').catch(() => {});
            await p.waitForTimeout(3500);
            const vooraf = await lees();
            log.push(`\nvoor de klik: ${vooraf.duwKop} | knop: ${vooraf.duwKnop}`);
            if (!vooraf.duwKnop) fouten.push('knop "kaart erbij" staat er niet bij twee kaarten');
            const v2 = await kar('/cart.js');
            await p.click('[data-tk3-staffelduw-knop]').catch(() => {});
            await p.waitForTimeout(7000);
            const n2 = await kar('/cart.js');
            if (v2 && n2) {
              log.push(`\nknop "kaart erbij": ${v2.item_count} → ${n2.item_count} stuks, ` +
                `${(v2.total_price / 100).toFixed(2)} → ${(n2.total_price / 100).toFixed(2)}`);
              if (n2.item_count <= v2.item_count) fouten.push('knop "kaart erbij" voegt niets toe');
              const verw = 3495 * 3 - Math.floor(3495 * 0.15) * 3;
              if (n2.total_price !== verw) fouten.push(`na toevoegen ${(n2.total_price / 100).toFixed(2)} in plaats van ${(verw / 100).toFixed(2)}`);
              const m3 = await lees();
              log.push(`   duw daarna: ${m3.duwKop} | ${m3.duwSub}`);
            } else { fouten.push('winkelwagen niet uit te lezen rond de knop kaart erbij'); }
            await p.screenshot({ path: 'preview/lade-erbij.png' });

            // welke link op de productpagina heeft geen doel?
            const leeg = await p.evaluate(() =>
              [...document.querySelectorAll('a')]
                .filter((a) => { const h = a.getAttribute('href'); return h === '' || h === '#' || h === null; })
                .map((a) => ({
                  klasse: (a.className || '').toString().slice(0, 60),
                  tekst: (a.innerText || '').replace(/\s+/g, ' ').trim().slice(0, 40),
                  ouder: (a.parentElement?.className || '').toString().slice(0, 50),
                }))
            );
            log.push('\nlinks zonder doel op de productpagina:');
            leeg.forEach((l) => log.push(`   klasse "${l.klasse}" tekst "${l.tekst}" in "${l.ouder}"`));

            await rust();
            await kar('/cart/clear.js', { method: 'POST' });
          } catch (e) {
            log.push('AFGEBROKEN: ' + String(e.message).split('\n')[0].slice(0, 140));
            fouten.push('proef afgebroken');
          }

          await b.close();
          const kop = fouten.length
            ? `GEVONDEN: ${[...new Set(fouten)].length} punten\n` + [...new Set(fouten)].map((f) => ' - ' + f).join('\n')
            : 'GEEN AFWIJKINGEN GEVONDEN';
          fs.writeFileSync('preview/ladeproef.txt', kop + '\n\n' + log.join('\n') + '\n');
          console.log(kop);
          JS
          node lade.mjs

      - name: Terugcommitten
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/ladeproef.txt preview/lade-*.png || true
          git commit -m "Uitkomst van de ladeproef" || echo "niets gewijzigd"
          for poging in 1 2 3 4; do
            git pull --rebase origin claude/3d-product-animations-btyc7y && git push && break
            sleep $((poging * 5))
          done
