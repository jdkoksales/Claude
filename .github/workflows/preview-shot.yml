name: Themapreview screenshotten

on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/preview-shot.yml', 'preview/trigger.txt', 'webshop/theme3/**']

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Preview vastleggen en links controleren
        run: |
          mkdir -p preview
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          const PV = '?preview_theme_id=196665213305';
          const PAGES = [
            ['home', '/'],
            ['product', '/products/tapkaarten-google-review-standaard'],
            ['collectie', '/collections/alle-tapkaarten'],
            ['winkelwagen', '/cart'],
            ['verzending', '/pages/verzending'],
            ['contact', '/pages/contact'],
          ];

          const b = await chromium.launch();
          const log = [];
          const errors = [];

          for (const [name, path] of PAGES) {
            for (const [w, h, tag] of [[1440, 900, 'desktop'], [390, 844, 'mobiel']]) {
              const p = await b.newPage({ viewport: { width: w, height: h } });
              p.on('pageerror', (e) => errors.push(`${name}/${tag} JS: ${e.message}`));
              p.on('response', (r) => {
                if (r.status() >= 400) errors.push(`${name}/${tag} ${r.status()} ${r.url().slice(0, 120)}`);
              });
              const resp = await p.goto(BASE + path + PV, { waitUntil: 'networkidle', timeout: 90000 }).catch(() => null);
              log.push(`${name} ${tag} status=${resp ? resp.status() : 'FOUT'}`);
              await p.addStyleTag({ content: '*{animation:none!important;transition:none!important}' });
              await p.evaluate(async () => {
                document.querySelectorAll('img[loading="lazy"]').forEach((i) => (i.loading = 'eager'));
                for (let y = 0; y < document.body.scrollHeight; y += window.innerHeight) {
                  window.scrollTo(0, y);
                  await new Promise((r) => setTimeout(r, 150));
                }
                window.scrollTo(0, 0);
              });
              await p.waitForTimeout(1200);
              await p.screenshot({ path: `preview/${name}-${tag}.png`, fullPage: true });
              if (tag === 'mobiel') {
                const breed = await p.evaluate(() => {
                  const doc = document.documentElement;
                  const te = [];
                  document.querySelectorAll('body *').forEach((el) => {
                    const r = el.getBoundingClientRect();
                    if (r.width > 0 && (r.right > doc.clientWidth + 1 || r.left < -1)) {
                      const sel =
                        el.tagName.toLowerCase() +
                        (el.className && typeof el.className === 'string'
                          ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.')
                          : '');
                      te.push(`${sel} ${Math.round(r.left)}..${Math.round(r.right)}`);
                    }
                  });
                  return { scrollW: doc.scrollWidth, clientW: doc.clientWidth, te: [...new Set(te)].slice(0, 8) };
                });
                if (breed.te.length) {
                  log.push(`  BREEDTE scroll=${breed.scrollW} client=${breed.clientW}`);
                  breed.te.forEach((x) => log.push(`    steekt uit: ${x}`));
                }
                // te kleine raakvlakken opsporen
                const klein = await p.$$eval('a, button, input, select, [role="button"]', (els) =>
                  els
                    .filter((el) => {
                      const r = el.getBoundingClientRect();
                      return r.width > 0 && r.height > 0 && (r.height < 34 || r.width < 34);
                    })
                    .map((el) => {
                      const r = el.getBoundingClientRect();
                      return `${el.tagName.toLowerCase()}${el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/)[0] : ''} ${Math.round(r.width)}x${Math.round(r.height)}`;
                    })
                );
                const uniek = [...new Set(klein)];
                if (uniek.length) log.push(`  KLEINE KNOPPEN ${uniek.slice(0, 8).join(', ')}`);
              }
              if (tag === 'desktop') {
                const meta = await p.evaluate(() => ({
                  t: document.title,
                  d: document.querySelector('meta[name="description"]')?.content || '-',
                  og: document.querySelector('meta[property="og:image"]')?.content || '-',
                }));
                log.push(`  titel  ${meta.t}`);
                log.push(`  omschr ${meta.d.slice(0, 90)}`);
                log.push(`  og     ${meta.og.split('/').pop().slice(0, 60)}`);
              }
              if (tag === 'desktop' && name === 'verzending') {
                // structuur van een gewone pagina, om de typografie gericht te kunnen bijstellen
                const html = await p.evaluate(() => {
                  const m = document.querySelector('main') || document.body;
                  return m.innerHTML.slice(0, 6000);
                });
                fs.writeFileSync('preview/pagina.html', html);
              }
              if (tag === 'desktop' && name === 'home') {
                // alle interne links verzamelen en stuk voor stuk controleren
                const links = await p.$$eval('a[href]', (as) =>
                  [...new Set(as.map((a) => a.getAttribute('href')).filter((h) => h && h.startsWith('/')))]
                );
                fs.writeFileSync('preview/links.txt', links.join('\n'));
              }
              await p.close();
            }
          }

          // echte bestelproef: linkveld plus de staffelkorting bij 1 t/m 5 stuks
          try {
            const prod = BASE + '/products/tapkaarten-google-review-standaard' + PV;
            for (const [naam, waarde] of [['zonder link', ''], ['met link', 'https://g.page/r/voorbeeld']]) {
              // elke proef in een eigen context, anders werkt de winkelwagen van de vorige ronde door
              const ctx = await b.newContext({ viewport: { width: 1440, height: 900 } });
              const t = await ctx.newPage();
              for (let poging = 1; poging <= 3; poging++) {
                await t.goto(prod, { waitUntil: 'domcontentloaded', timeout: 60000 }).catch(() => {});
                const ok = await t
                  .waitForSelector('[data-add-to-cart]', { timeout: 30000 })
                  .then(() => true)
                  .catch(() => false);
                if (ok) break;
                if (poging === 3) throw new Error('knop niet gevonden op de productpagina');
              }
              if (waarde) await t.fill('[data-tk3-linkveld]', waarde);
              await t.click('[data-add-to-cart]');
              await t.waitForTimeout(3000);
              const cart = await t.evaluate(() => fetch('/cart.js').then((r) => r.json()));
              const it = cart.items && cart.items[0];
              const props = it ? JSON.stringify(it.properties || {}) : 'GEEN REGEL';
              log.push(`winkelwagenproef ${naam}: ${it ? it.quantity + '×' : ''} ${it ? it.title : ''} props=${props}`);
              await ctx.close();
            }
          } catch (e) {
            log.push('winkelwagenproef MISLUKT: ' + e.message.split('\n')[0]);
          }

          // staffelkorting: klopt het bedrag bij elk aantal?
          try {
            const ctx = await b.newContext();
            const t = await ctx.newPage();
            await t.goto(BASE + '/cart' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await t.waitForTimeout(15000); // de winkelwagen-API even met rust laten
            const euro = (c) => '€ ' + (c / 100).toFixed(2).replace('.', ',');
            for (const q of [1, 2, 3, 4, 5]) {
              const r = await t.evaluate(async (aantal) => {
                const wacht = (ms) => new Promise((res) => setTimeout(res, ms));
                // Shopify knijpt de winkelwagen-API af; bij een 429 wachten en opnieuw.
                const post = async (url, body) => {
                  for (let poging = 1; poging <= 6; poging++) {
                    const res = await fetch(url, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify(body),
                    });
                    if (res.status !== 429) return res;
                    await wacht(poging * 5000);
                  }
                  return { ok: false, status: 429 };
                };
                // update.js zet het aantal absoluut, dus geen clear + add nodig
                const up = await post('/cart/update.js', { updates: { 64057218662777: aantal } });
                if (!up.ok) return { fout: 'aantal zetten mislukt ' + up.status };
                const c = await up.json();
                const regel = (c.items || []).find((i) => i.variant_id === 64057218662777) || {};
                const namen = []
                  .concat(regel.line_level_discount_allocations || [], c.cart_level_discount_applications || [])
                  .map((d) => (d.discount_application ? d.discount_application.title : d.title))
                  .filter(Boolean);
                return { sub: c.original_total_price, korting: c.total_discount, tot: c.total_price, namen: namen };
              }, q);
              if (r.fout) { log.push(`staffel ${q}×: ${r.fout}`); continue; }
              const pct = r.sub ? Math.round((r.korting / r.sub) * 100) : 0;
              log.push(
                `staffel ${q}×: van ${euro(r.sub)} af ${euro(r.korting)} (${pct}%) => ${euro(r.tot)}  [${r.namen.join(' | ')}]`
              );
              await t.waitForTimeout(4000);
            }
            await t.evaluate(() => fetch('/cart/update.js', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ updates: { 64057218662777: 0 } }),
            }));
            await ctx.close();
          } catch (e) {
            log.push('staffelproef MISLUKT: ' + e.message.split('\n')[0]);
          }

          // linkcontrole
          const links = fs.readFileSync('preview/links.txt', 'utf8').split('\n').filter(Boolean);
          const p = await b.newPage();
          for (const href of links) {
            if (href.startsWith('/#')) continue;
            const r = await p.goto(BASE + href + PV, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            const code = r ? r.status() : 'FOUT';
            log.push(`link ${code} ${href}`);
          }
          await p.close();
          await b.close();

          fs.writeFileSync('preview/controle.txt',
            log.join('\n') + '\n\n--- fouten ---\n' + [...new Set(errors)].join('\n'));
          console.log(log.join('\n'));
          JS
          node shot.mjs
          ls -la preview

      - name: Terugcommitten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "Preview-screenshots van het tk3-thema" || echo "niets gewijzigd"
          git push
