name: Gegenereerd beeld ophalen

# De beeldgenerator levert af op een tijdelijke CDN-link die ik vanuit deze
# omgeving niet mag ophalen, en die na verloop van tijd verloopt. Deze runner
# haalt hem binnen en zet hem in de repo, zodat het beeld blijft bestaan en
# ik het kan beoordelen.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/haalbeeld.yml', 'preview/beeld-urls.txt']

permissions:
  contents: write

jobs:
  halen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - name: Downloaden
        # Geen externe pakketten: de runner heeft Pillow niet, en de breedte en
        # hoogte van een PNG staan gewoon op een vaste plek in de kop. En geen
        # enkel bestand mag de rest van de lijst meeslepen, dus elke stap kan
        # falen zonder de lus af te breken.
        run: |
          mkdir -p webshop/hero-voorstellen/ai preview
          : > preview/beeld-log.txt
          mislukt=0
          while read -r naam url; do
            [ -z "$naam" ] && continue
            case "$naam" in \#*) continue ;; esac
            doel="webshop/hero-voorstellen/ai/$naam"
            code=$(curl -sS -L -o "$doel" -w '%{http_code}' "$url" || echo 000)
            maat=$(stat -c%s "$doel" 2>/dev/null || echo 0)
            if [ "$code" = "200" ] && [ "$maat" -ge 10000 ]; then
              afm=$(python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(26); print('%dx%d' % struct.unpack('>II', d[16:24]))" "$doel" 2>/dev/null || echo "?x?")
              echo "$naam  $code  $maat bytes  $afm" >> preview/beeld-log.txt
            else
              echo "$naam  MISLUKT status $code, $maat bytes" >> preview/beeld-log.txt
              rm -f "$doel"
              mislukt=$((mislukt + 1))
            fi
          done < preview/beeld-urls.txt
          echo "" >> preview/beeld-log.txt
          echo "$mislukt van de bestanden mislukt" >> preview/beeld-log.txt
          cat preview/beeld-log.txt

      - name: Vastleggen
        if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add webshop/hero-voorstellen/ai preview/beeld-log.txt || true
          git commit -m "Gegenereerd beeld opgehaald" || exit 0
          for poging in 1 2 3 4; do
            git pull --rebase origin claude/3d-product-animations-btyc7y && \
              git push origin HEAD:claude/3d-product-animations-btyc7y && break
            sleep $((poging * 4))
          done
