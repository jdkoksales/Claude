<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Samen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2932"/>
      <stop offset="1" stop-color="#12181e"/>
    </linearGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0be"/>
      <stop offset="1" stop-color="#3f9c7f"/>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a184"/>
      <stop offset="1" stop-color="#d0674a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Twee levens die elkaar overlappen; in de overlap staat het vinkje. -->
  <g fill="none" stroke-width="26" stroke-linecap="round">
    <circle cx="203" cy="262" r="99" stroke="url(#ringA)"/>
    <circle cx="309" cy="262" r="99" stroke="url(#ringB)"/>
  </g>
  <path d="M224 264l24 25 42-48" fill="none" stroke="#f7f4ef" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
