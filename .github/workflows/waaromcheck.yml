name: Waarom-sectie nameten

# Maakt een afbeelding van de nieuwe sectie in het conceptthema en meet of
# alles er echt staat. De controles zijn positief geformuleerd: een sectie
# die niet rendert levert nul kaarten op en zakt, in plaats van stil te
# slagen omdat er "niets mis" gevonden is.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/waaromcheck.yml', 'preview/waarom-trigger.txt']

permissions:
  contents: write

jobs:
  kijken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Nameten en afbeelding maken
        run: |
          mkdir -p preview
          cat > waarom.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          const PV = '?preview_theme_id=196964024697';
          const log = [];
          const fouten = [];

          const b = await chromium.launch();
          for (const [naam, w, h, kolommen] of [
            ['desktop', 1440, 900, 3],
            ['tablet', 900, 800, 2],
            ['telefoon', 411, 750, 1],
          ]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, locale: 'nl-NL' });
            const p = await ctx.newPage();
            await p.goto(BASE + '/' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(3500);
            await p.evaluate(() => {
              document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
            });

            const sectie = await p.$('.tk3 .waarom');
            if (!sectie) { fouten.push(`${naam}: sectie staat er niet`); await ctx.close(); continue; }
            await sectie.scrollIntoViewIfNeeded();
            await p.waitForTimeout(1200);

            const m = await p.evaluate(() => {
              const s = document.querySelector('.tk3 .waarom');
              const zichtbaar = (el) => {
                if (!el) return false;
                const r = el.getBoundingClientRect();
                return r.width > 0 && r.height > 0;
              };
              const kaarten = [...s.querySelectorAll('.wrm-kaart')];
              const grid = s.querySelector('.wrm-grid');
              const cijfer = s.querySelector('.wrm-cijfer');
              const cs = cijfer ? getComputedStyle(cijfer) : null;
              const knop = s.querySelector('.wrm-knop');
              return {
                themaId: (window.Shopify && Shopify.theme && Shopify.theme.id) || 'onbekend',
                hoog: Math.round(s.getBoundingClientRect().height),
                kop: (s.querySelector('.wrm-kop') || {}).innerText || '',
                kicker: zichtbaar(s.querySelector('.wrm-kicker')),
                kaarten: kaarten.length,
                kaartenGevuld: kaarten.filter((k) => {
                  const c = k.querySelector('.wrm-cijfer');
                  const t = k.querySelector('.wrm-tekst');
                  const br = k.querySelector('.wrm-bron');
                  return zichtbaar(c) && (c.innerText || '').trim().length > 0
                    && zichtbaar(t) && (t.innerText || '').trim().length > 0
                    && br && (br.innerText || '').trim().length > 0;
                }).length,
                // Het getal is doorzichtige tekst met een kleurverloop erachter.
                // Valt background-clip weg, dan is het getal onzichtbaar terwijl
                // de tekst er in de HTML gewoon staat — dus dat meten we apart.
                clip: cs ? (cs.webkitBackgroundClip || cs.backgroundClip) : null,
                kleur: cs ? cs.color : null,
                kolommen: grid ? getComputedStyle(grid).gridTemplateColumns.split(' ').length : 0,
                lijstregels: s.querySelectorAll('.wrm-lijst li').length,
                punch: zichtbaar(s.querySelector('.wrm-punch')),
                knop: zichtbaar(knop),
                knopHref: knop ? knop.getAttribute('href') : null,
                bronnen: zichtbaar(s.querySelector('.wrm-bronnen')),
                klantverhalen: !!document.querySelector('.tk3 .klanten'),
                overloop: Math.max(0, document.documentElement.scrollWidth - innerWidth),
              };
            });

            log.push(`\n${naam} ${w}x${h} — thema ${m.themaId}`);
            log.push(`   sectie ${m.hoog}px hoog, ${m.kaarten} kaarten waarvan ${m.kaartenGevuld} volledig gevuld`);
            log.push(`   kop: "${m.kop}"`);
            log.push(`   kolommen ${m.kolommen}, lijstregels ${m.lijstregels}, knop → ${m.knopHref}`);
            log.push(`   getal: background-clip ${m.clip}, kleur ${m.kleur}`);
            log.push(`   kicker ${m.kicker}, punch ${m.punch}, knop ${m.knop}, bronnen ${m.bronnen}`);
            log.push(`   overloop ${m.overloop}px, klantverhalen nog aanwezig: ${m.klantverhalen}`);

            if (m.hoog < 400) fouten.push(`${naam}: sectie maar ${m.hoog}px hoog`);
            if (m.kaarten !== 6) fouten.push(`${naam}: ${m.kaarten} kaarten in plaats van 6`);
            if (m.kaartenGevuld !== 6) fouten.push(`${naam}: ${m.kaartenGevuld} van de 6 kaarten volledig gevuld`);
            if (!m.kop.includes('vraagt het')) fouten.push(`${naam}: kop klopt niet ("${m.kop}")`);
            if (m.clip !== 'text') fouten.push(`${naam}: getal heeft background-clip ${m.clip}, wordt onzichtbaar`);
            if (m.kolommen !== kolommen) fouten.push(`${naam}: ${m.kolommen} kolommen in plaats van ${kolommen}`);
            if (m.lijstregels !== 3) fouten.push(`${naam}: ${m.lijstregels} lijstregels in plaats van 3`);
            if (!m.kicker) fouten.push(`${naam}: labeltje boven de kop niet zichtbaar`);
            if (!m.punch) fouten.push(`${naam}: afsluitende zin niet zichtbaar`);
            if (!m.knop) fouten.push(`${naam}: knop niet zichtbaar`);
            if (!m.knopHref) fouten.push(`${naam}: knop heeft geen link`);
            if (!m.bronnen) fouten.push(`${naam}: bronvermelding niet zichtbaar`);
            if (m.klantverhalen) fouten.push(`${naam}: de klantverhalen staan er nog steeds`);
            if (m.overloop > 0) fouten.push(`${naam}: pagina schuift ${m.overloop}px opzij`);

            await sectie.screenshot({ path: `preview/waarom-${naam}.png` });

            // De lichte uitvoering staat in de themabewerker als optie klaar.
            // Als die niet klopt staat er lichte tekst op een lichte achtergrond
            // en ziet de eigenaar dat pas nadat hij de knop heeft omgezet. Dus
            // zetten we hem hier zelf even om en meten we of het leesbaar blijft.
            if (naam === 'desktop') {
              const licht = await p.evaluate(() => {
                const s = document.querySelector('.tk3 .waarom');
                s.classList.remove('dark');
                s.classList.add('licht');
                const helderheid = (kleur) => {
                  const [r, g, bl] = (kleur.match(/[\d.]+/g) || []).map(Number);
                  return 0.2126 * r + 0.7152 * g + 0.0722 * bl;
                };
                const meet = (sel) => {
                  const el = s.querySelector(sel);
                  return el ? { kleur: getComputedStyle(el).color, h: helderheid(getComputedStyle(el).color) } : null;
                };
                const kaart = s.querySelector('.wrm-kaart');
                return {
                  tekst: meet('.wrm-tekst'),
                  punch: meet('.wrm-punch'),
                  bron: meet('.wrm-bron'),
                  kaartAchtergrond: kaart ? getComputedStyle(kaart).backgroundColor : null,
                };
              });
              log.push(`   licht: tekst ${licht.tekst && licht.tekst.kleur}, punch ${licht.punch && licht.punch.kleur}, ` +
                `bron ${licht.bron && licht.bron.kleur}, kaart ${licht.kaartAchtergrond}`);
              for (const [wat, meting] of [['tekst', licht.tekst], ['punch', licht.punch], ['bron', licht.bron]]) {
                if (!meting) fouten.push(`licht: ${wat} niet gevonden`);
                else if (meting.h > 140) fouten.push(`licht: ${wat} is te licht (${meting.kleur}) op een lichte achtergrond`);
              }
              await p.evaluate(() => {
                const s = document.querySelector('.tk3 .waarom');
                s.classList.remove('licht');
                s.classList.add('dark');
              });
            }
            await ctx.close();
          }
          await b.close();

          const kop = fouten.length
            ? `GEVONDEN: ${fouten.length} punten\n` + fouten.map((f) => ' - ' + f).join('\n')
            : 'GEEN AFWIJKINGEN GEVONDEN';
          fs.writeFileSync('preview/waarom.txt', kop + '\n' + log.join('\n') + '\n');
          console.log(kop);
          JS
          node waarom.mjs

      - name: Vastleggen
        if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add preview/waarom.txt preview/waarom-*.png || true
          git commit -m "Uitkomst van de waarom-sectie" || exit 0
          for poging in 1 2 3 4; do
            git pull --rebase origin claude/3d-product-animations-btyc7y && \
              git push origin HEAD:claude/3d-product-animations-btyc7y && break
            sleep $((poging * 4))
          done
