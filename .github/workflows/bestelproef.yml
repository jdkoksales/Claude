name: Bestelproces doormeten

# Lichte tegenhanger van preview-shot.yml: alleen het bestelpad, geen
# schermafdrukken van alle pagina's. Bedoeld om snel te kunnen itereren.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/bestelproef.yml', 'preview/bestel-trigger.txt']

permissions:
  contents: write

jobs:
  proef:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Bestelpad doorlopen
        run: |
          mkdir -p preview
          cat > proef.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          const PV = '?preview_theme_id=196665213305';
          const log = [];
          const b = await chromium.launch();

          const nieuw = async (w = 1440, h = 900) => {
            const ctx = await b.newContext({ viewport: { width: w, height: h } });
            const p = await ctx.newPage();
            p.on('console', (m) => {
              if (m.type() === 'error') log.push(`    console: ${m.text().slice(0, 160)}`);
            });
            p.on('pageerror', (e) => log.push(`    JS-fout: ${e.message.slice(0, 160)}`));
            return { ctx, p };
          };

          // ---------- 1. wat is er aan lade-onderdelen aanwezig? ----------
          {
            const { ctx, p } = await nieuw();
            await p.goto(BASE + '/' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(2500);
            const info = await p.evaluate(() => {
              const attrs = new Set();
              document.querySelectorAll('*').forEach((el) => {
                for (const a of el.attributes) {
                  if (a.name.startsWith('data-cart')) attrs.add(a.name);
                }
              });
              return {
                lade: !!document.querySelector('[data-cart-drawer]'),
                attrs: [...attrs].sort(),
                globals: Object.keys(window).filter((k) => /cart|drawer/i.test(k)).slice(0, 12),
                cartlink: document.querySelector('.cartlink')?.getAttribute('href') || 'geen',
              };
            });
            log.push(`lade aanwezig: ${info.lade}`);
            log.push(`  data-cart-attributen: ${info.attrs.join(', ')}`);
            log.push(`  globals: ${info.globals.join(', ') || 'geen'}`);
            log.push(`  header-winkelwagenlink: ${info.cartlink}`);
            await ctx.close();
          }

          // ---------- 2. calculator: klik op bestellen ----------
          {
            const { ctx, p } = await nieuw();
            await p.goto(BASE + '/' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('.cfg-checkout', { timeout: 30000 });
            const staat = await p.evaluate(() => {
              const k = document.querySelector('.cfg-checkout');
              const r = k.getBoundingClientRect();
              return { disabled: k.disabled, klassen: k.className, groot: `${Math.round(r.width)}x${Math.round(r.height)}` };
            });
            log.push(`calculatorknop: ${JSON.stringify(staat)}`);
            await p.evaluate(() => document.querySelector('.cfg-checkout').scrollIntoView({ block: 'center' }));
            await p.waitForTimeout(400);
            const voor = p.url();
            await p.click('.cfg-checkout');
            await p.waitForTimeout(6000);
            const fout = await p.evaluate(() => {
              const e = document.querySelector('.cfg-error');
              return e && !e.hidden ? e.textContent.trim() : '';
            });
            log.push(`  na klik: ${p.url() === voor ? 'GEEN NAVIGATIE' : p.url().slice(0, 110)}`);
            if (fout) log.push(`  foutmelding in beeld: ${fout}`);
            const kar = await p.evaluate(() => fetch('/cart.js').then((r) => r.json()).then((c) => c.item_count));
            log.push(`  regels in winkelwagen: ${kar}`);
            await ctx.close();
          }

          // ---------- 3. winkelwagenpagina: klik op afrekenen ----------
          {
            const { ctx, p } = await nieuw();
            await p.goto(BASE + '/products/tapkaarten-google-review-standaard' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('[data-add-to-cart]', { timeout: 30000 });
            await p.click('[data-add-to-cart]');
            await p.waitForTimeout(3500);
            await p.goto(BASE + '/cart' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForTimeout(2000);
            const knoppen = await p.evaluate(() =>
              [...document.querySelectorAll('a[href*="checkout"], button[name="checkout"], [data-checkout]')].map((el) => {
                const r = el.getBoundingClientRect();
                const zichtbaar = r.width > 0 && r.height > 0;
                return `${el.tagName.toLowerCase()}${el.name ? '[name=' + el.name + ']' : ''} "${el.textContent.trim().slice(0, 26)}" zichtbaar=${zichtbaar}`;
              })
            );
            log.push(`winkelwagenpagina knoppen: ${knoppen.join(' | ') || 'GEEN'}`);
            const voor = p.url();
            const doel = p.locator('button[name="checkout"]:visible, main a[href*="checkout"]:visible').first();
            if (await doel.count()) {
              await doel.click({ timeout: 15000 }).catch((e) => log.push(`    klik mislukt: ${e.message.split('\n')[0].slice(0, 90)}`));
              await p.waitForTimeout(8000);
              log.push(`  na klik: ${p.url() === voor ? 'GEEN NAVIGATIE' : p.url().slice(0, 110)}`);
            } else {
              log.push('  geen zichtbare afrekenknop gevonden');
            }
            await ctx.close();

            // ---------- 3b. lade openen via de winkelwagenknop in de kopregel ----------
            {
              const { ctx: c2, p: p2 } = await nieuw();
              // eerst iets in de winkelwagen, anders valt er niets te tonen
              await p2.goto(BASE + '/' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await p2.evaluate(() =>
                fetch('/cart/add.js', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ items: [{ id: 64057218662777, quantity: 2 }] }),
                })
              );
              await p2.reload({ waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
              await p2.waitForTimeout(2000);
              const heeft = await p2.evaluate(() => !!document.querySelector('[data-cart-toggle]'));
              log.push(`kopregel heeft data-cart-toggle: ${heeft}`);
              if (heeft) {
                await p2.click('[data-cart-toggle]');
                await p2.waitForTimeout(2500);
                const open = await p2.evaluate(() => {
                  const d = document.querySelector('[data-cart-drawer]');
                  const r = d.querySelector('.cart-drawer__panel').getBoundingClientRect();
                  const knop = d.querySelector('.cart-drawer__checkout-button');
                  return {
                    klasse: d.className,
                    paneel: `${Math.round(r.width)}x${Math.round(r.height)} @x=${Math.round(r.left)}`,
                    regels: d.querySelectorAll('[data-cart-item-key]').length,
                    subtotaal: d.querySelector('[data-cart-drawer-subtotal]')?.textContent.trim(),
                    kassaknop: knop ? knop.getAttribute('href') : 'geen',
                    telling: document.querySelector('[data-cart-count]')?.textContent.trim(),
                  };
                });
                log.push(`  lade na klik: ${JSON.stringify(open)}`);
                await p2.screenshot({ path: 'preview/lade.png' });
              }
              await p2.evaluate(() =>
                fetch('/cart/update.js', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ updates: { 64057218662777: 0 } }),
                })
              );
              await c2.close();
            }
          }

          // ---------- 3c. productpagina: opent de lade na toevoegen? ----------
          {
            const { ctx, p } = await nieuw();
            await p.goto(BASE + '/products/tapkaarten-instagram-standaard' + PV, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await p.waitForSelector('[data-add-to-cart]', { timeout: 30000 });
            const voor = p.url();
            await p.click('[data-add-to-cart]');
            await p.waitForTimeout(4000);
            const na = await p.evaluate(() => {
              const d = document.querySelector('[data-cart-drawer]');
              return {
                laadOpen: d ? d.classList.contains('is-open') : false,
                regels: d ? d.querySelectorAll('[data-cart-item-key]').length : 0,
                telling: document.querySelector('[data-cart-count]')?.textContent.trim(),
                genavigeerd: location.pathname,
              };
            });
            log.push(`productpagina toevoegen: ${JSON.stringify(na)} (was ${voor.includes('/products/') ? 'productpagina' : '?'})`);
            if (na.laadOpen) await p.screenshot({ path: 'preview/lade-product.png' });
            await p.evaluate(() =>
              fetch('/cart/clear.js', { method: 'POST' })
            );
            await ctx.close();
          }

          // ---------- 4. rechtstreeks naar /checkout ----------
          {
            const { ctx, p } = await nieuw();
            await p.goto(BASE + '/cart/clear' + PV, { waitUntil: 'domcontentloaded' }).catch(() => {});
            await p.evaluate(() =>
              fetch('/cart/add.js', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: [{ id: 64057218662777, quantity: 1 }] }),
              })
            );
            await p.waitForTimeout(1500);
            const r = await p.goto(BASE + '/checkout', { waitUntil: 'domcontentloaded', timeout: 60000 }).catch((e) => {
              log.push(`  /checkout gooide: ${e.message.slice(0, 110)}`);
              return null;
            });
            log.push(`rechtstreeks /checkout: status=${r ? r.status() : 'FOUT'} url=${p.url().slice(0, 110)}`);
            await ctx.close();
          }

          await b.close();
          fs.writeFileSync('preview/bestelproef.txt', log.join('\n') + '\n');
          console.log(log.join('\n'));
          JS
          node proef.mjs

      - name: Terugcommitten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/bestelproef.txt preview/lade.png preview/lade-product.png
          git commit -m "Uitkomst van de bestelproef" || echo "niets gewijzigd"
          git push
