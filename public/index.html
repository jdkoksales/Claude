<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)" />
  <title>Samen</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
  <!-- iOS doet niets met een SVG op het beginscherm; zonder deze PNG zet het
       een screenshot van de pagina neer in plaats van het icoon. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Samen" />

  <!-- Zodat de link in WhatsApp niet kaal oogt. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Samen" />
  <meta property="og:title" content="Samen" />
  <meta property="og:description" content="Onze agenda, onze doelen en onze leuke momenten. Op één plek." />
  <!-- Voluit, want de voorvertoning van WhatsApp volgt geen relatief pad. -->
  <meta property="og:url" content="https://samen-agenda.vercel.app/" />
  <meta property="og:image" content="https://samen-agenda.vercel.app/share.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Alle pictogrammen één keer gedefinieerd; de rest van de app verwijst
       ernaar met <use>. Zo blijft alles scherp en consistent, ook op systemen
       waar emoji er anders uitzien. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <g id="i-sun" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </g>
      <g id="i-week" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="16" rx="3" />
        <path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 14h3M8 17.5h8" />
      </g>
      <g id="i-target" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5" />
        <circle cx="12" cy="12" r="4.5" />
        <circle cx="12" cy="12" r="1" fill="currentColor" />
      </g>
      <g id="i-check-list" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 6.5l2 2 3.5-3.5M3.5 13l2 2 3.5-3.5M3.5 19.5l2 2 3.5-3.5M12.5 7h8M12.5 13.5h8M12.5 20h8" />
      </g>
      <g id="i-more" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="5" cy="12" r="1.4" />
        <circle cx="12" cy="12" r="1.4" />
        <circle cx="19" cy="12" r="1.4" />
      </g>
      <path id="i-plus" d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round" />
      <path id="i-check" d="M4.5 12.5l5 5 10-11" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
      <path id="i-close" d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-linecap="round" />
      <path id="i-edit" d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5V20zM14.5 6.5L17.5 9.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
      <path id="i-left" d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
      <path id="i-right" d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
      <g id="i-calendar-empty" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="16" rx="3" />
        <path d="M3 9.5h18M8 2.5v4M16 2.5v4" />
      </g>
      <g id="i-sparkle" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" />
      </g>
      <g id="i-heart" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20s-7.5-4.7-7.5-9.7A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.9C19.5 15.3 12 20 12 20z" />
      </g>
      <g id="i-camera" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8.5h3.5L8 6h8l1.5 2.5H21v11H3z" />
        <circle cx="12" cy="13.5" r="3.5" />
      </g>
      <g id="i-comment" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5h16v11H9l-5 4z" />
      </g>
      <g id="i-trash" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6.5h16M9.5 6.5V4h5v2.5M6.5 6.5l1 14h9l1-14M10.5 10v7M13.5 10v7" />
      </g>
      <g id="i-mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9.5" cy="12" r="6.2" stroke="currentColor" stroke-width="1.9" />
        <circle cx="14.5" cy="12" r="6.2" stroke="currentColor" stroke-width="1.9" opacity=".5" />
      </g>
    </defs>
  </svg>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Vandaag</h1>
        <p id="view-sub"></p>
      </div>
      <div id="avatars" class="avatars"></div>
      <button id="add-btn" class="icon-btn primary" type="button" aria-label="Nieuw item toevoegen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus" /></svg>
      </button>
    </header>

    <main id="views">
      <section class="view" data-view="vandaag"></section>
      <section class="view" data-view="week" hidden></section>
      <section class="view" data-view="momenten" hidden></section>
      <section class="view" data-view="doelen" hidden></section>
      <section class="view" data-view="taken" hidden></section>
      <section class="view" data-view="meer" hidden></section>
    </main>

    <nav class="tabbar" role="tablist">
      <button class="tab is-active" data-tab="vandaag" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun" /></svg>Vandaag
      </button>
      <button class="tab" data-tab="week" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-week" /></svg>Week
      </button>
      <button class="tab" data-tab="momenten" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart" /></svg>Momenten
      </button>
      <button class="tab" data-tab="doelen" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-target" /></svg>Doelen
      </button>
      <button class="tab" data-tab="taken" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check-list" /></svg>Taken
      </button>
      <button class="tab" data-tab="meer" role="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more" /></svg>Meer
      </button>
    </nav>
  </div>

  <div id="gate" class="gate">
    <div class="gate-card" id="gate-card">
      <div class="spinner" aria-label="Bezig met laden"></div>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Nieuw</h2>
        <button class="icon-btn ghost" type="button" data-close="1" aria-label="Sluiten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
