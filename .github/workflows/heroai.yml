name: Nieuwe hero nameten

# Kijkt of de gegenereerde hero op elke schermgrootte klopt: het juiste
# bestand, witte tekst op de oranje foto, en — het belangrijkste — of de
# uitsnede de standaard niet half wegsnijdt.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    # Ook op de stylesheet zelf: een hero-aanpassing zit bijna altijd daar,
    # en anders meet ik de vorige versie na.
    paths: ['.github/workflows/heroai.yml', 'preview/heroai-trigger.txt',
            'webshop/theme3/assets/tk3.css', 'webshop/theme3/sections/tk3-hero.liquid']

permissions:
  contents: write

jobs:
  meten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Meten
        run: |
          mkdir -p preview
          cat > heroai.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ikep5e-3q.myshopify.com';
          const PV = '?preview_theme_id=197367529849';
          const log = [];
          const fouten = [];

          // Waar het witte paneel in elk bronbeeld staat, opgemeten op het
          // bestand zelf. Valt dat bereik buiten de zichtbare uitsnede, dan
          // snijdt object-fit de standaard eraf.
          // Waar het witte paneel in elk bronbestand staat, opgemeten op het
          // bestand zelf: [links, rechts, boven, onder] als fractie.
          // De korte telefoonvensters staan er met opzet bij. Een toestel meldt
          // 390x844, maar met browserbalk en de voorbeeldbalk van Shopify hou je
          // rond de 600px over — en juist daar sneed de uitsnede het bordje weg.
          const SCHERMEN = [
            ['ultrabreed',     3440, 1440, 'desktop',      [0.275, 0.481, 0.225, 0.892]],
            ['breed',          2560, 1080, 'desktop',      [0.275, 0.481, 0.225, 0.892]],
            ['desktop-groot',  1920, 1080, 'desktop',      [0.275, 0.481, 0.225, 0.892]],
            ['desktop',        1440, 900,  'desktop',      [0.275, 0.481, 0.225, 0.892]],
            ['tablet',         834,  1000, 'tablet-krap',  [0.394, 0.626, 0.070, 0.866]],
            ['tablet-kort',    834,  700,  'tablet-krap',  [0.394, 0.626, 0.070, 0.866]],
            ['telefoon',       390,  844,  'telefoon-krap',[0.316, 0.743, 0.058, 0.914]],
            ['telefoon-kort',  360,  615,  'telefoon-krap',[0.316, 0.743, 0.058, 0.914]],
            ['telefoon-klein', 360,  560,  'telefoon-krap',[0.316, 0.743, 0.058, 0.914]],
          ];

          const b = await chromium.launch();
          for (const [naam, w, h, bestand, paneel] of SCHERMEN) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, locale: 'nl-NL' });
            const p = await ctx.newPage();
            await p.goto(BASE + '/' + PV, { waitUntil: 'load', timeout: 60000 });
            await p.waitForTimeout(3000);
            await p.evaluate(() => {
              document.querySelectorAll('#preview-bar-iframe, #shopify-pc__banner').forEach((el) => el.remove());
            });

            const m = await p.evaluate((paneel) => {
              const hero = document.querySelector('.tk3 .hero');
              const img = hero && hero.querySelector('.hero-foto img');
              if (!hero || !img) return null;
              const r = img.getBoundingClientRect();
              const cs = getComputedStyle(img);
              const zicht = (el) => {
                if (!el) return false;
                const q = el.getBoundingClientRect();
                return q.width > 0 && q.height > 0;
              };

              // Waar belandt het paneel op het scherm? object-fit: cover schaalt
              // op de grootste factor en snijdt de rest weg; object-position
              // bepaalt waar dat wegsnijden begint.
              const nw = img.naturalWidth, nh = img.naturalHeight;
              const schaal = Math.max(r.width / nw, r.height / nh);
              const dw = nw * schaal, dh = nh * schaal;
              const pos = cs.objectPosition.split(' ');
              const fx = pos[0].endsWith('%') ? parseFloat(pos[0]) / 100 : 0.5;
              const fy = pos[1] && pos[1].endsWith('%') ? parseFloat(pos[1]) / 100 : 1;
              const ox = r.left + (r.width - dw) * fx;
              const oy = r.top + (r.height - dh) * fy;
              const bordje = {
                left: ox + paneel[0] * dw, right: ox + paneel[1] * dw,
                top: oy + paneel[2] * dh, bottom: oy + paneel[3] * dh,
              };

              const botst = (el) => {
                if (!el) return null;
                const q = el.getBoundingClientRect();
                if (q.width === 0 || q.height === 0) return null;
                const bx = Math.max(0, Math.min(q.right, bordje.right) - Math.max(q.left, bordje.left));
                const by = Math.max(0, Math.min(q.bottom, bordje.bottom) - Math.max(q.top, bordje.top));
                return bx > 2 && by > 2 ? Math.round(bx) + 'x' + Math.round(by) + 'px' : null;
              };

              // Hoeveel van het bordje overleeft de uitsnede zelf? object-fit
              // klipt alles buiten de lijst van de foto; dat is een andere
              // vraag dan of het binnen het venster valt, en juist die vraag
              // werd nooit gesteld.
              const inLijst = (() => {
                const zicht = Math.max(0, Math.min(bordje.bottom, r.bottom) - Math.max(bordje.top, r.top));
                return Math.round(zicht / Math.max(1, bordje.bottom - bordje.top) * 100);
              })();

              const kop = hero.querySelector('h1');
              const sub = hero.querySelector('.sub');
              const bediening = hero.querySelector('.controls');
              const calc = hero.querySelector('.hero-calc');

              return {
                themaId: (window.Shopify && Shopify.theme && Shopify.theme.id) || 'onbekend',
                bron: (img.currentSrc || img.src).split('/').pop().split('?')[0],
                natuurlijk: [nw, nh],
                vlak: [Math.round(r.width), Math.round(r.height)],
                objectPosition: cs.objectPosition,
                objectFit: cs.objectFit,
                bordje: {
                  left: Math.round(bordje.left), right: Math.round(bordje.right),
                  top: Math.round(bordje.top), bottom: Math.round(bordje.bottom),
                },
                botsingen: {
                  kop: botst(kop), onderkop: botst(sub),
                  knoppen: botst(bediening), rekenlink: botst(calc),
                },
                // Niet alleen 'begint binnen het scherm': het grootste deel
                // moet zichtbaar zijn, anders staat hij onder de vouw.
                bordjeInLijst: inLijst,
                bordjeZichtbaarDeel: (() => {
                  const zicht = Math.max(0, Math.min(bordje.bottom, innerHeight) - Math.max(bordje.top, 0));
                  return Math.round(zicht / Math.max(1, bordje.bottom - bordje.top) * 100);
                })(),
                hoogtes: (() => {
                  const h = (s) => { const e = hero.querySelector(s); return e ? Math.round(e.getBoundingClientRect().height) : 0; };
                  return { wrap: h('.wrap'), kop: h('h1'), sub: h('.sub'), knoppen: h('.controls'), calc: h('.hero-calc'), foto: h('.hero-foto') };
                })(),
                venster: innerHeight,
                bordjeHoog: Math.round(bordje.bottom - bordje.top),
                heroHoog: Math.round(hero.getBoundingClientRect().height),
                kopKleur: kop ? getComputedStyle(kop).color : null,
                kopTekst: kop ? kop.innerText.replace(/\s+/g, ' ').slice(0, 60) : null,
                // Past het langste woord van de kop nog in de kolom? Zo niet,
                // dan breekt de browser middenin een woord — "TapKaarte / n."
                // Meten door dat woord echt te renderen, niet door de breedte
                // te schatten.
                kopKolom: kop ? Math.round(kop.getBoundingClientRect().width) : 0,
                langsteWoord: (() => {
                  if (!kop) return null;
                  const cs = getComputedStyle(kop);
                  const meet = document.createElement('span');
                  meet.style.cssText = 'position:absolute;visibility:hidden;white-space:pre';
                  meet.style.font = cs.font;
                  meet.style.letterSpacing = cs.letterSpacing;
                  document.body.appendChild(meet);
                  let breedst = 0, woord = '';
                  for (const w of kop.innerText.split(/\s+/).filter(Boolean)) {
                    meet.textContent = w;
                    const b = meet.getBoundingClientRect().width;
                    if (b > breedst) { breedst = b; woord = w; }
                  }
                  meet.remove();
                  return { woord: woord, breedte: Math.round(breedst) };
                })(),
                kopRegels: (() => {
                  if (!kop || !kop.firstChild) return null;
                  const r = document.createRange();
                  r.selectNodeContents(kop);
                  return r.getClientRects().length;
                })(),
                subKleur: sub ? getComputedStyle(sub).color : null,
                kopZichtbaar: zicht(kop), subZichtbaar: zicht(sub),
                knopZichtbaar: zicht(hero.querySelector('.buy')),
                oudeShots: !!hero.querySelector('.shots'),
                platformkiezer: !!hero.querySelector('.seg'),
                waaromSectie: !!document.querySelector('.tk3 .waarom'),
                // Wat komt er direct na de hero, en staan de producten er echt?
                // Een lege of kapotte productsectie bovenaan is erger dan een
                // productsectie halverwege, dus dat wordt hier geteld.
                naDeHero: (() => {
                  const secties = [...document.querySelectorAll('.tk3 > section, .tk3 > div')]
                    .filter((e) => e.getBoundingClientRect().height > 8);
                  const i = secties.findIndex((e) => e.classList.contains('hero'));
                  const v = i >= 0 ? secties[i + 1] : null;
                  return v ? (v.className || v.tagName).toString().trim().split(/\s+/)[0] : null;
                })(),
                productKaarten: document.querySelectorAll('.tk3 .pcard').length,
                productTop: (() => {
                  const e = document.querySelector('.tk3 .pcard');
                  return e ? Math.round(e.getBoundingClientRect().top + scrollY) : null;
                })(),
                knopTekst: (hero.querySelector('.buy') || {}).innerText ? hero.querySelector('.buy').innerText.trim() : null,
                overloop: Math.max(0, document.documentElement.scrollWidth - innerWidth),
              };
            }, paneel);

            if (!m) { fouten.push(`${naam}: hero of foto niet gevonden`); await ctx.close(); continue; }

            log.push(`\n${naam} ${w}x${h} — thema ${m.themaId}`);
            log.push(`   bestand: ${m.bron}  (bron ${m.natuurlijk[0]}x${m.natuurlijk[1]}, vlak ${m.vlak[0]}x${m.vlak[1]})`);
            log.push(`   object-fit ${m.objectFit}, object-position ${m.objectPosition}`);
            log.push(`   bordje op het scherm: x ${m.bordje.left}–${m.bordje.right}, y ${m.bordje.top}–${m.bordje.bottom} (${m.bordjeHoog}px hoog)`);
            log.push(`   hero ${m.heroHoog}px hoog, kop ${m.kopKleur}, onderkop ${m.subKleur}`);
            log.push(`   kop "${m.kopTekst}"`);
            log.push(`   overloop ${m.overloop}px, oude wisselfoto's nog aanwezig: ${m.oudeShots}`);
            for (const [wat, hoeveel] of Object.entries(m.botsingen)) {
              log.push(`   botsing ${wat}: ${hoeveel || 'geen'}`);
              if (hoeveel) fouten.push(`${naam}: ${wat} ligt over het bordje heen (${hoeveel})`);
            }
            if (m.platformkiezer) fouten.push(`${naam}: de platformkiezer staat er nog`);
            if (m.waaromSectie) fouten.push(`${naam}: de waarom-sectie staat nog op de pagina`);
            log.push(`   na de hero: ${m.naDeHero}, ${m.productKaarten} productkaarten, eerste kaart op ${m.productTop}px`);
            if (m.productKaarten < 1) fouten.push(`${naam}: er staat geen enkele productkaart op de pagina`);
            if (m.productTop === null || m.productTop > m.heroHoog + m.venster * 0.5)
              fouten.push(`${naam}: de eerste productkaart staat op ${m.productTop}px, te ver onder de hero (${m.heroHoog}px)`);
            if (m.kopTekst !== 'Laat jouw bedrijf groeien met TapKaarten.') fouten.push(`${naam}: de kop is "${m.kopTekst}"`);
            if (m.knopTekst !== 'Bestel nu!') fouten.push(`${naam}: de knop zegt "${m.knopTekst}" en niet "Bestel nu!"`);

            if (!m.bron.includes(bestand)) fouten.push(`${naam}: laadt ${m.bron} in plaats van de ${bestand}-versie`);
            if (m.natuurlijk[0] === 0) fouten.push(`${naam}: de foto is niet geladen`);
            if (m.objectFit !== 'cover') fouten.push(`${naam}: object-fit is ${m.objectFit}`);
            if (m.kopKleur !== 'rgb(255, 255, 255)') fouten.push(`${naam}: de kop is ${m.kopKleur} en niet wit`);
            if (!m.kopZichtbaar) fouten.push(`${naam}: de kop is niet zichtbaar`);
            log.push(`   kopkolom ${m.kopKolom}px, langste woord "${m.langsteWoord.woord}" is ${m.langsteWoord.breedte}px, ${m.kopRegels} regels`);
            if (m.langsteWoord && m.kopKolom < m.langsteWoord.breedte)
              fouten.push(`${naam}: de kopkolom is ${m.kopKolom}px en "${m.langsteWoord.woord}" ${m.langsteWoord.breedte}px — dat woord breekt middenin`);
            if (m.kopRegels > 3) fouten.push(`${naam}: de kop staat over ${m.kopRegels} regels`);
            if (!m.subZichtbaar && m.venster > 700) fouten.push(`${naam}: de onderkop is niet zichtbaar terwijl er hoogte genoeg is`);
            if (m.subZichtbaar && m.venster <= 700 && w < 1024) fouten.push(`${naam}: de onderkop staat er nog op een kort venster`);
            if (!m.knopZichtbaar) fouten.push(`${naam}: de koopknop is niet zichtbaar`);
            if (m.oudeShots) fouten.push(`${naam}: de oude wisselfoto's staan er nog`);
            if (m.overloop > 0) fouten.push(`${naam}: pagina schuift ${m.overloop}px opzij`);
            if (m.heroHoog < 400) fouten.push(`${naam}: hero maar ${m.heroHoog}px hoog`);
            log.push(`   hoogtes: ${JSON.stringify(m.hoogtes)}, venster ${m.venster}px`);
            log.push(`   bordje voor ${m.bordjeInLijst}% binnen de foto-uitsnede, ${m.bordjeZichtbaarDeel}% binnen het scherm`);
            if (m.bordjeInLijst < 99) fouten.push(`${naam}: de uitsnede snijdt ${100 - m.bordjeInLijst}% van het bordje weg`);
            if (m.bordjeZichtbaarDeel < 85) fouten.push(`${naam}: het bordje is maar voor ${m.bordjeZichtbaarDeel}% zichtbaar, de rest valt onder de vouw`);
            if (m.heroHoog > m.venster * 1.25) fouten.push(`${naam}: de hero is ${m.heroHoog}px op een scherm van ${m.venster}px`);
            if (m.bordjeHoog < m.heroHoog * 0.22) fouten.push(`${naam}: het bordje is maar ${m.bordjeHoog}px, te klein voor een hero`);

            await p.screenshot({ path: `preview/heroai-${naam}.png` });
            await ctx.close();
          }
          await b.close();

          const kop = fouten.length
            ? `GEVONDEN: ${fouten.length} punten\n` + fouten.map((f) => ' - ' + f).join('\n')
            : 'GEEN AFWIJKINGEN GEVONDEN';
          fs.writeFileSync('preview/heroai.txt', kop + '\n' + log.join('\n') + '\n');
          console.log(kop);
          JS
          node heroai.mjs

      - name: Vastleggen
        if: always()
        run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add preview/heroai.txt preview/heroai-*.png || true
          git commit -m "Uitkomst van de nieuwe hero" || exit 0
          for poging in 1 2 3 4; do
            git pull --rebase origin claude/3d-product-animations-btyc7y && \
              git push origin HEAD:claude/3d-product-animations-btyc7y && break
            sleep $((poging * 4))
          done
