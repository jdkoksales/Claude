name: Themapreview screenshotten

on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['.github/workflows/preview-shot.yml', 'preview/trigger.txt']

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Preview vastleggen
        run: |
          mkdir -p preview
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const URL = 'https://ikep5e-3q.myshopify.com/?preview_theme_id=196665213305';
          const b = await chromium.launch();
          for (const [w, h, tag] of [[1440, 900, 'desktop'], [390, 844, 'mobiel']]) {
            const p = await b.newPage({ viewport: { width: w, height: h }, deviceScaleFactor: 1 });
            const resp = await p.goto(URL, { waitUntil: 'networkidle', timeout: 90000 });
            console.log(tag, 'status', resp && resp.status());
            await p.addStyleTag({ content: '*{animation:none!important;transition:none!important}' });
            await p.waitForTimeout(2000);
            await p.screenshot({ path: `preview/${tag}-boven.png` });
            // lui geladen beelden wakker maken voor de volledige opname
            await p.evaluate(async () => {
              document.querySelectorAll('img[loading="lazy"]').forEach(i => i.loading = 'eager');
              const step = window.innerHeight;
              for (let y = 0; y < document.body.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise(r => setTimeout(r, 200));
              }
              window.scrollTo(0, 0);
            });
            await p.waitForLoadState('networkidle').catch(() => {});
            await p.waitForTimeout(1500);
            await p.screenshot({ path: `preview/${tag}-volledig.png`, fullPage: true });
            if (tag === 'desktop') {
              const fs = await import('fs');
              fs.writeFileSync('preview/pagina.html', await p.content());
              const diag = await p.evaluate(() => {
                const out = [];
                const iw = window.innerWidth;
                out.push('innerWidth ' + iw);
                out.push('doc.scrollWidth ' + document.documentElement.scrollWidth);
                out.push('body.width ' + document.body.getBoundingClientRect().width);
                for (const sel of ['main', 'footer', '.shopify-section', '.tk3', '.marquee']) {
                  const el = document.querySelector(sel);
                  if (el) {
                    const r = el.getBoundingClientRect();
                    const cs = getComputedStyle(el);
                    out.push(`${sel} left=${r.left} width=${r.width} pad=${cs.paddingLeft}/${cs.paddingRight} max=${cs.maxWidth}`);
                  }
                }
                out.push('--- breder dan viewport:');
                document.querySelectorAll('body *').forEach(el => {
                  const r = el.getBoundingClientRect();
                  if (r.width > iw + 1 || r.right > iw + 1) {
                    out.push(`${el.tagName}.${el.className}`.slice(0, 90) + ` w=${Math.round(r.width)} right=${Math.round(r.right)}`);
                  }
                });
                return out.join('\n');
              });
              fs.writeFileSync('preview/diagnose.txt', diag);
            }
            await p.close();
          }
          await b.close();
          JS
          node shot.mjs
          ls -la preview

      - name: Terugcommitten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview
          git commit -m "Preview-screenshots van het tk3-thema" || echo "niets gewijzigd"
          git push
