name: Hero-afbeeldingen ophalen

on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['hero-urls.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y
      - name: Download
        run: |
          mkdir -p hero-src
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            echo "-> $name"
            curl -fsSL -o "hero-src/$name" "$url" || echo "FAILED $name"
          done < hero-urls.txt
          ls -la hero-src
      - name: Commit en push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hero-src
          git commit -m "Hero-afbeeldingen opgehaald" || echo "niets nieuws"
          git push origin claude/3d-product-animations-btyc7y
