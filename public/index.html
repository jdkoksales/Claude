<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d2430" />
  <title>Samen</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Samen" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="view-title">Vandaag</h1>
        <p id="view-sub" class="muted"></p>
      </div>
      <button id="add-btn" class="icon-btn primary" type="button" aria-label="Nieuw item toevoegen">+</button>
    </header>

    <main id="views">
      <section class="view" data-view="vandaag"></section>
      <section class="view" data-view="week" hidden></section>
      <section class="view" data-view="doelen" hidden></section>
      <section class="view" data-view="taken" hidden></section>
      <section class="view" data-view="meer" hidden></section>
    </main>

    <nav class="tabbar" role="tablist">
      <button class="tab is-active" data-tab="vandaag" role="tab"><span class="tab-ico">☀</span>Vandaag</button>
      <button class="tab" data-tab="week" role="tab"><span class="tab-ico">▤</span>Week</button>
      <button class="tab" data-tab="doelen" role="tab"><span class="tab-ico">◎</span>Doelen</button>
      <button class="tab" data-tab="taken" role="tab"><span class="tab-ico">✓</span>Taken</button>
      <button class="tab" data-tab="meer" role="tab"><span class="tab-ico">⋯</span>Meer</button>
    </nav>
  </div>

  <div id="gate" class="gate">
    <div class="gate-card" id="gate-card">
      <div class="spinner" aria-label="Bezig met laden"></div>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title">Nieuw</h2>
        <button class="icon-btn ghost" type="button" data-close="1" aria-label="Sluiten">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
