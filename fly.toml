# Deze naam is wereldwijd uniek — verzin er een eigen.
app = "samen-agenda"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SECURE_COOKIES = "true"
  TIMEZONE = "Europe/Amsterdam"
  DB_FILE = "/data/samen.json"

# De gegevens staan op een volume, zodat een herstart of nieuwe versie niets wist.
[mounts]
  source = "samen_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # De app moet blijven draaien: hij verstuurt herinneringen op de klok.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
