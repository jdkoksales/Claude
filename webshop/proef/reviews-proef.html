<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proefpagina reviewsectie</title>

<!--
  De reviewsectie staat pas op de winkel als er echte reviews in staan, en
  verzonnen klantverhalen zetten we er niet in — dat staat met zoveel woorden
  op de site zelf. Om de sectie tóch te kunnen nameten staat hier dezelfde
  opmaak met duidelijk nepnamen, met de echte stylesheet eronder.

  De opmaak moet gelijk blijven aan sections/tk3-reviews.liquid; reviewcheck.yml
  vergelijkt de gebruikte klassenamen tussen die twee bestanden.
-->
<link rel="stylesheet" href="../theme3/assets/tk3.css">
<style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}</style>

<div class="tk3">
  <section class="blk grey" id="reviews">
    <div class="wrap">
      <p class="kicker center">Wat klanten zeggen</p>
      <h2 class="sec-title center">Ondernemers die het al op de balie hebben staan.</h2>
      <p class="sec-sub center">Onderkop om de ruimte na te meten.</p>

      <div class="revs">
        <figure class="rev">
          <div class="rev-sterren" role="img" aria-label="5 van de 5 sterren">
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
          </div>
          <blockquote>Korte proeftekst van één regel.</blockquote>
          <figcaption class="rev-wie">
            <span class="rev-foto rev-letter" aria-hidden="true">P</span>
            <span class="rev-naam"><strong>Proefnaam een</strong><span>Proefzaak, Proefstad</span></span>
          </figcaption>
        </figure>

        <figure class="rev">
          <div class="rev-sterren" role="img" aria-label="4 van de 5 sterren">
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class=""><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
          </div>
          <blockquote>Een langere proeftekst, met opzet een stuk langer dan de andere twee, zodat na te meten valt of de naam onderaan de kaart blijft staan in plaats van mee omhoog te schuiven met de tekst. Nog een zin erbij om het verschil groot genoeg te maken.</blockquote>
          <figcaption class="rev-wie">
            <img class="rev-foto" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMTIiIGhlaWdodD0iMTEyIj48cmVjdCB3aWR0aD0iMTEyIiBoZWlnaHQ9IjExMiIgZmlsbD0iIzc3ODhhYSIvPjwvc3ZnPg==" alt="Proefnaam twee" width="56" height="56">
            <span class="rev-naam"><strong>Proefnaam twee</strong><span>Proefzaak, Proefstad</span></span>
          </figcaption>
        </figure>

        <figure class="rev">
          <div class="rev-sterren" role="img" aria-label="3 van de 5 sterren">
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class="aan"><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class=""><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
            <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true" class=""><path d="M10 1.6l2.5 5.4 5.9.7-4.4 4 1.2 5.8L10 14.6 4.8 17.5 6 11.7 1.6 7.7l5.9-.7z"/></svg>
          </div>
          <blockquote>Proeftekst van middelmatige lengte, twee regels ongeveer, om de tussenmaat te dekken.</blockquote>
          <figcaption class="rev-wie">
            <span class="rev-foto rev-letter" aria-hidden="true">D</span>
            <span class="rev-naam"><strong>Proefnaam drie</strong><span>Proefzaak, Proefstad</span></span>
          </figcaption>
        </figure>
      </div>

      <p class="rev-note center">Regel onder de reviews.</p>
    </div>
  </section>
</div>
</html>
