name: Referentiesite analyseren

on:
  workflow_dispatch:
  push:
    branches: [claude/3d-product-animations-btyc7y]
    paths: ['ref-target.txt']

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/3d-product-animations-btyc7y

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installeren
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Analyseren
        run: |
          mkdir -p ref
          node scrape-ref.mjs

      - name: Commit en push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ref
          git commit -m "Referentie-analyse bijgewerkt" || echo "niets nieuws"
          git push origin claude/3d-product-animations-btyc7y
